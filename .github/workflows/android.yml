name: Android internal checks
on:
  push:
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/android.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.19'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: flutter analyze && flutter test
        working-directory: apps/mobile
      - name: Generate ephemeral public loopback certificate for internal manifest checks
        shell: bash
        run: |
          qj_tls_dir=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -keyout "$qj_tls_dir/key.pem" -out "$qj_tls_dir/cert.pem" >/dev/null 2>&1
          rm "$qj_tls_dir/key.pem"
          echo "QJ_INTERNAL_TLS_CERT_FILE=$qj_tls_dir/cert.pem" >> "$GITHUB_ENV"
      - run: ./gradlew :wallpaper_android:testDebugUnitTest :wallpaper_android:lintDebug
        working-directory: apps/mobile/android
      - run: flutter build apk --debug --flavor local
        working-directory: apps/mobile
      - run: flutter build apk --release --flavor local
        working-directory: apps/mobile
      - run: ./gradlew :app:processProdReleaseManifest :app:processInternalReleaseManifest
        working-directory: apps/mobile/android
      - run: python3 scripts/verify-mobile-manifests.py
