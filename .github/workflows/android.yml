name: Android internal checks
on:
  push:
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/android.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.19'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: flutter analyze && flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug --flavor local
        working-directory: apps/mobile
      - run: flutter build apk --release --flavor local
        working-directory: apps/mobile
      - run: ./gradlew :app:processProdReleaseManifest
        working-directory: apps/mobile/android
      - run: python3 scripts/verify-mobile-manifests.py
