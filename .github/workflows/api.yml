name: API and secure media checks
on:
  push:
    paths: ['services/api-server/**', 'contracts/openapi/**', 'packages/wallpaper-format/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['services/api-server/**', 'contracts/openapi/**', 'packages/wallpaper-format/**', '.github/workflows/api.yml']
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.19'
          cache: maven
      - name: Install media validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify API, migrations and real media
        run: ./mvnw verify
        working-directory: services/api-server
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: contracts/openapi/package-lock.json
      - run: npm ci && npm test && npm run baseline:check
        working-directory: contracts/openapi
