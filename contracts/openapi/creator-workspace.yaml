          }
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "required": [
                "record",
                "mediaIds"
              ],
              "properties": {
                "record": {
                  "type": "object",
