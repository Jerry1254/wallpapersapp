      "parameters": [
        {
          "name": "X-Media-Id",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$",
            "maxLength": 128
          }
        },
        {
          "name": "X-Filename",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "description": "UTF-8 URL 编码的文件名"
          }
        },
        {
          "name": "X-Media-Metadata",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "maxLength": 16000,
            "description": "UTF-8 URL 编码 JSON，包含 type: image/video/audio/4d/bundle"
          }
        }
      ],
      "description": "图片不超过 50 MiB，4D ZIP 不超过 100 MiB，视频、音频和任务素材包不超过 512 MiB。与壁纸上传/上架 API 分开；此接口不签发 App 正式下载资源。",
      "requestBody": {
        "required": true,
        "content": {
          "application/octet-stream": {
            "schema": {
              "type": "string",
              "format": "binary"
            }
          }
        }
      }
    }
