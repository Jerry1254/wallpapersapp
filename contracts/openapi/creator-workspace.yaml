{
  "records": {
    "get": {
      "tags": [
        "Admin Creator"
      ],
      "operationId": "creatorRecordsList",
      "summary": "分页读取创作集合，包含软删除记录",
      "security": [
        {
          "adminCookie": []
        }
      ],
      "responses": {
        "200": {
          "description": "操作成功",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "items",
                  "nextCursor"
                ],
                "properties": {
                  "items": {
                    "type": "array",
                    "items": {
                      "$ref": "#/schemas/Record"
                    }
                  },
                  "nextCursor": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$",
                    "maxLength": 128,
                    "nullable": true
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "401": {
          "description": "管理会话失效"
        },
        "403": {
          "description": "CSRF 校验失败"
        },
        "404": {
          "description": "记录或素材不存在"
        },
        "409": {
          "description": "任务状态、租约或素材幂等标识冲突"
        },
        "412": {
          "description": "乐观锁版本冲突"
        },
        "422": {
          "description": "参数或媒体清单无效"
        }
      },
      "parameters": [
        {
          "name": "collection",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "enum": [
              "projects",
              "templates",
              "favorites",
              "works",
              "meta"
            ]
          }
        },
        {
          "name": "after",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$",
            "maxLength": 128
          }
        },
        {
          "name": "limit",
          "in": "query",
          "required": false,
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 25,
            "default": 20
          }
        }
      ]
    }
  },
