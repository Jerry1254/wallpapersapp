  "schemas": {
    "Record": {
      "type": "object",
      "required": [
        "record",
        "version"
      ],
      "properties": {
        "record": {
          "type": "object",
          "required": [
            "id"
          ],
          "properties": {
            "id": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$",
              "maxLength": 128
            }
          },
          "additionalProperties": true
        },
        "version": {
          "type": "integer",
          "format": "int64",
          "minimum": 1
        }
      }
    },
    "Media": {
      "type": "object",
      "required": [
        "id",
        "filename",
        "type",
        "mimeType",
        "sizeBytes",
        "sha256",
        "metadata"
      ],
      "properties": {
        "id": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$",
          "maxLength": 128
        },
        "filename": {
          "type": "string"
        },
        "type": {
          "type": "string",
          "enum": [
            "image",
            "video",
            "audio",
            "4d",
            "bundle"
          ]
        },
        "mimeType": {
          "type": "string"
        },
        "sizeBytes": {
          "type": "integer",
          "format": "int64",
          "minimum": 1
        },
        "sha256": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "metadata": {
          "type": "object",
          "additionalProperties": true
        }
      }
    },
    "Task": {
      "type": "object",
      "required": [
        "id",
        "projectId",
        "type",
        "state",
        "stage",
        "inputHash",
        "outputMediaIds",
        "attempt",
        "updatedAt"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "projectId": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$",
          "maxLength": 128
        },
        "type": {
          "type": "string",
          "enum": [
            "WALLPAPER_RENDER",
            "CONTENT_RENDER",
            "GALLERY_RENDER"
          ]
        },
        "state": {
          "type": "string",
          "enum": [
            "PREPARING",
            "QUEUED",
            "RUNNING",
            "CANCEL_REQUESTED",
            "CANCELLED",
            "SUCCEEDED",
            "FAILED",
            "INTERRUPTED"
          ]
        },
        "stage": {
          "type": "string",
          "maxLength": 255
        },
        "progress": {
          "type": "number",
          "minimum": 0,
          "maximum": 100,
          "nullable": true
        },
        "inputHash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "input": {
          "type": "object",
          "additionalProperties": true
        },
        "name": {
          "type": "string"
        },
        "payloadMediaId": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$",
          "maxLength": 128,
          "nullable": true
        },
        "outputMediaIds": {
          "type": "array",
          "items": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$",
            "maxLength": 128
          }
        },
        "attempt": {
          "type": "integer",
          "minimum": 0
        },
        "leaseToken": {
          "type": "string",
          "format": "uuid",
          "nullable": true
        },
        "error": {
          "type": "string",
          "maxLength": 1000,
          "nullable": true
        },
        "updatedAt": {
          "type": "string",
          "format": "date-time"
        }
      }
    }
  }
}
