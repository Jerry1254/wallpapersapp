      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "scheduledAt": {
                  "type": "string",
                  "description": "空字符串代表立即排队，否则传 UTC ISO 8601 时间；定时是到点开始上传。"
                },
                "entries": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "accountId": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "post": {
                        "$ref": "#/schemas/Post"
                      }
                    },
                    "required": [
                      "accountId",
                      "post"
                    ],
                    "additionalProperties": false
                  },
                  "minItems": 1,
                  "maxItems": 50,
                  "description": "1–50 条发布任务。同一账号可接收不同内容；相同账号、类型、有序素材不能重复。"
                }
              },
              "required": [
                "id",
                "entries"
              ],
              "additionalProperties": false
            }
          }
        }
      },
      "description": "同一 id 与同一内容重试返回原任务；同一 id 内容变化返回 409。逐账号保存内容快照。小红书标题最多 20 字、图文最多 18 张；抖音图文标题最多 20 字、35 张，视频标题最多 30 字；正文与话题合计当前支持 1000 字，话题最多 10 个。不静默截断内容。 source 为当前项目和有序素材标识；后台核对项目归属及文件引用，并固化作品名称与生成任务标识。不同账号可使用独立 post；不创建发布草稿。 同一账号可包含多条不同作品；同一账号与相同有序素材重复返回 422，并回滚整个批次。",
      "operationId": "creatorDistributionBatchesPost"
    }
