                      "accountId": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "post": {
                        "$ref": "#/schemas/Post"
                      }
                    },
                    "required": [
                      "accountId",
                      "post"
                    ],
                    "additionalProperties": false
                  },
                  "minItems": 1,
                  "maxItems": 50
                }
              },
              "required": [
                "id",
                "entries"
              ],
              "additionalProperties": false
            }
          }
        }
      },
      "description": "同一 id 与同一内容重试返回原任务；同一 id 内容变化返回 409。逐账号保存内容快照。小红书标题最多 20 字、图文最多 18 张；抖音图文标题最多 20 字、35 张，视频标题最多 30 字；正文与话题合计当前支持 1000 字，话题最多 10 个。不静默截断内容。",
      "operationId": "creatorDistributionBatchesPost"
    }
