    "Account": {
      "type": "object",
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "platform": {
          "type": "string",
          "enum": [
            "xhs",
            "douyin"
          ]
        },
        "name": {
          "type": "string",
          "maxLength": 80
        },
        "group": {
          "type": "string",
          "maxLength": 80
        },
        "runnerId": {
          "type": "string",
          "format": "uuid"
        },
        "status": {
          "type": "string",
          "enum": [
            "ready",
            "expired",
            "disconnected"
          ]
        },
        "checkedAt": {
          "type": "string",
          "format": "date-time",
          "nullable": true
        }
      },
      "required": [
        "id",
        "platform",
        "name",
        "group",
        "runnerId",
        "status"
      ],
      "additionalProperties": false
    },
    "Post": {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "maxLength": 30
        },
        "body": {
          "type": "string",
          "maxLength": 1000
        },
        "tags": {
          "type": "array",
          "items": {
            "type": "string",
            "maxLength": 50
          },
          "maxItems": 10
        },
        "type": {
          "type": "string",
          "enum": [
            "image",
            "video"
          ]
        },
        "mediaIds": {
          "type": "array",
          "items": {
            "type": "string",
            "format": "uuid"
          },
          "minItems": 1,
          "maxItems": 35
        },
        "coverId": {
          "type": "string"
        },
        "landscapeCoverId": {
          "type": "string"
        },
        "declaration": {
          "type": "string",
          "enum": [
            "",
            "内容由AI生成",
            "内容为个人观点或见解"
          ]
        }
      },
      "required": [
        "title",
        "body",
        "tags",
        "type",
        "mediaIds"
      ],
      "additionalProperties": false
    },
    "Job": {
      "type": "object",
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "accountId": {
          "type": "string",
          "format": "uuid"
        },
        "accountName": {
          "type": "string"
        },
        "platform": {
          "type": "string",
          "enum": [
            "xhs",
            "douyin"
          ]
        },
        "post": {
          "$ref": "#/schemas/Post"
        },
        "status": {
          "type": "string",
          "enum": [
            "queued",
            "running",
            "submitting",
            "submitted",
            "published",
            "failed",
            "uncertain",
            "needs_input",
            "cancelled"
          ]
        },
        "message": {
          "type": "string"
        },
        "dueAt": {
          "type": "string",
          "format": "date-time"
        },
        "updatedAt": {
          "type": "string",
          "format": "date-time"
        },
        "resultUrl": {
          "type": "string",
          "format": "uri",
          "nullable": true
        }
      },
      "required": [
        "id",
        "accountId",
        "accountName",
        "platform",
        "post",
        "status",
        "message",
        "dueAt",
        "updatedAt"
      ],
      "additionalProperties": false
    },
    "Metrics": {
      "type": "object",
      "properties": {
        "followers": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "plays": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "likes": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "favorites": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        },
        "comments": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        }
      },
      "additionalProperties": false
    },
    "Ok": {
      "type": "object",
      "properties": {
        "ok": {
          "type": "boolean"
        }
      },
      "required": [
        "ok"
      ],
      "additionalProperties": false
    }
  }
}
