openapi: 3.0.3
info:
  title: 倾境壁纸 iOS 首次免费与苹果内购（待实现契约）
  version: 0.2.0
  license:
    name: Proprietary
    url: https://github.com/Jerry1254/wallpapersapp
  description: |
    本文件是尚未部署的增量契约，不改变线上 2.13.0 API。
    前端 IOS_ACQUISITION_ENABLED 默认关闭；Java 实现、真机防重领测试完成后才开启。
    安卓与鸿蒙兑换流程保持不变。无平台登录，使用现有 iOS 安装会话。
    每个已发布壁纸绑定一个稳定的非消耗型 Apple productId，禁止同商品映射多张壁纸。
    当前安装的免费和付费权益写入 MySQL；已有下载票据 API 校验这些权益后才交付原始 MP4。
    免费资格必须组合验证 DeviceCheck、App Attest、一次性挑战及后端领取账本。
    不允许把本地标记、Keychain、IDFV、客户端 scope 或可重建的 P256 安装公钥当成物理设备的免费资格。
    DeviceCheck 两位信息属于开发者级范围；需为该平台明确保留 bit0 表示已领取，不擅自覆盖其他应用使用的 bit。
    不支持设备证明、苹果查询失败、状态不明时，不得按新设备发放免费权益。
    DeviceCheck 查询与更新不是原子操作：跨安装并发、部分失败及补偿需独立评估并测试，不保证绝对无法作弊。
    App Attest 密钥按安装生成，卸载后重建；DeviceCheck 位负责识别此前已领取的同一物理设备。
    Xcode 本地测试交易不能发放生产权益；Sandbox 和审核购买走明确隔离的测试账本。
    正式交易必须通过 Apple App Store Server Library 验证证书链、JWS、环境、Bundle ID、appAppleId、商品、撤销状态。
    恢复购买允许历史交易绑定到新安装，不得因原 appAccountToken 属于旧安装而一概拒绝。
    同时必须验证当前 Apple 购买证明和可信 App 的请求；不能仅解码客户端 JWS 就信任它。
    新购买的 appAccountToken 使用服务端签发的当前安装 UUID，不采集 Apple 账号密码。
    接入 App Store Server Notifications V2 处理退款、撤销和商品状态变化。
    普通启动读 StoreKit currentEntitlements；AppStore.sync 仅用于用户主动点击恢复购买。
    前端在 Java 返回确定的付费权益后才 finish 原交易；失败后保留交易以便恢复与幂等重试。
    0.2.0 增加待实现的测试机首免重置和 Apple 通知接口；现有前端尚未实现重置握手。
    管理员只能给指定测试安装发起一次重置；手机提交新证明后修改苹果 bit0，保留 bit1。
    重置撤销免费来源、递增免费代次并保留审计，不删除设备或付费权益，不重置证明计数器。
    已完成 resetId 的重试绝不能再次清零设备位；同安装领取、重置和迟到 worker 需持久化串行协调。
servers:
  - url: /api/v1
security:
  - deviceBearer: []
tags:
  - name: iOS Acquisition
    description: 仅对 IOS 安装开放；签名格式沿用正式契约的敏感请求规范
  - name: iOS Test Administration
    description: 沿用现有管理员会话与 CSRF，仅操作显式标记的测试安装
  - name: Apple Notifications
    description: Apple 签名的服务端交易通知，不使用 App 设备会话
paths:
  /device/ios/attestation/challenges:
    post:
      tags: [iOS Acquisition]
      operationId: createIosAcquisitionChallenge
      summary: 创建绑定安装、App Attest 密钥、动作和目标壁纸的一次性挑战
      description: |
        所有 POST 沿用现有 deviceBearer 和 P256 敏感请求验签，不能只核验 Bearer。
        ENROLL 返回完整且不应被客户端改写的 clientData，服务端验证其 SHA256 与 attestation nonce。
        其他动作返回 nonce；断言覆盖业务请求的原始 UTF-8 JSON 字节。
        挑战最长 120 秒，仅能使用一次；绑定 keyId、安装、动作、壁纸和当前免费代次，拒绝跨请求复用。
        FREE_RESET 必须提供 resetId 并绑定当前安装待处理操作；其他动作不接受 resetId。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId, action]
              additionalProperties: false
              properties:
                keyId: {type: string, minLength: 1, maxLength: 256}
                action: {type: string, enum: [ENROLL, STATUS, FREE_CLAIM, PURCHASE_SYNC, FREE_RESET]}
                wallpaperId: {$ref: '#/components/schemas/WallpaperId'}
                resetId: {type: string, format: uuid}
      responses:
        '200':
          description: 新鲜随机挑战；ENROLL 必须包含 clientData
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, nonce, expiresAt]
                properties:
                  challengeId: {type: string, format: uuid}
                  nonce: {type: string, minLength: 32}
                  clientData: {type: string, maxLength: 32768}
                  expiresAt: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/attestation/registrations:
    post:
      tags: [iOS Acquisition]
      operationId: registerIosAttestation
      summary: 验证并绑定当前安装的 App Attest 密钥
      description: |
        服务端验证 Apple App Attestation Root CA 链、nonce、rpIdHash、凭据公钥与 keyId、aaguid 环境及计数器。
        App ID prefix 和 Bundle ID 来自可信服务端配置，不能取客户端 scope 作为依据，也不能无条件以 Team ID 代替 prefix。
        挑战和注册提交以事务/幂等记录协调；失败不能标记注册成功。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId, challengeId, attestation]
              additionalProperties: false
              properties:
                keyId: {type: string, maxLength: 256}
                challengeId: {type: string, format: uuid}
                attestation: {type: string, format: byte, maxLength: 32768}
      responses:
        '200':
          description: 密钥已绑定当前安装
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                properties:
                  registered: {type: boolean, enum: [true]}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/status:
    post:
      tags: [iOS Acquisition]
      operationId: getIosAcquisitionState
      summary: 查询真实设备的免费资格和本次安装权益
      parameters:
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceProofRequest'}
      responses:
        '200':
          description: 服务端已验证挑战、断言计数器及苹果 DeviceCheck 状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/free-claims:
    post:
      tags: [iOS Acquisition]
      operationId: claimIosFirstFreeWallpaper
      summary: 幂等领取一张首次免费壁纸
      description: |
        以 requestId + 当前安装 + wallpaperId 记录幂等业务事实，重试使用新挑战但相同 requestId。
        同一 idempotency 目标不许换壁纸，已提交结果直接返回，不再次扣免费资格。
        领取前核验当前官方 App/设备证明、DeviceCheck bit0 以及 MySQL 状态；领取后确认为已使用。
        更新 DeviceCheck 与提交 MySQL 存在外部事务窗口，必须记录处理中状态、补偿与原目标重试能力。
        同安装请求锁只能处理本安装并发，不能伪称能完全解决同一物理设备跨安装的竞态。
        资格按获取一张壁纸消耗，不按下载次数消耗；后续同安装下载仍校验权益。
        409 IOS_FREE_ALLOWANCE_USED 必须是确定未发放该幂等请求的拒绝；结果未知返回其他可重试错误。
        存在未完成重置时拒绝新领取；challenge 绑定的免费代次必须仍有效。
        已被重置撤销的旧 requestId 返回 IOS_FREE_CLAIM_RESET，不重新发放免费来源。
      parameters:
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/DeviceProofRequest'}
                - type: object
                  required: [wallpaperId, requestId]
                  properties:
                    wallpaperId: {$ref: '#/components/schemas/WallpaperId'}
                    requestId: {type: string, format: uuid}
      responses:
        '200':
          description: 已持久化当前安装免费权益；重复请求返回同一结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/purchases:
    post:
      tags: [iOS Acquisition]
      operationId: synchronizeIosPurchasedWallpaper
      summary: 验证苹果购买或恢复交易并更新当前安装的权益
      description: |
        按可信 Apple transactionId/originalTransactionId 幂等，商品映射和正式价格由服务端和 Apple 管理。
        不接受客户端 purchased=true、壁纸 ID、客户端 environment 或价格作为购买证明。
        已购买壁纸为非消耗型商品；卸载重装后支持有效恢复，不重新收费，不重新发放免费额度。
        服务端验证撤销/退款，返回免费和付费两种来源的最新快照，不能误删同壁纸独立免费权益。
        只有当前购买或有效历史恢复验证完成后才发放本安装权益；不能信任粘贴来的任意 JWT。
      parameters:
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, nonce, signedTransaction]
              properties:
                challengeId: {type: string, format: uuid}
                nonce: {type: string}
                signedTransaction: {type: string, minLength: 10, maxLength: 32768}
      responses:
        '200':
          description: 已验签并持久化或撤销对应的安装付费权益
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/free-resets/{resetId}/complete:
    post:
      tags: [iOS Acquisition]
      operationId: completeIosTestFreeReset
      summary: 指定测试手机提供新证明，推进管理员授权的一次首免重置
      description: |
        待实现；需要现有设备会话、P256 签名、App Attest 及 FREE_RESET challenge。
        resetId、keyId、当前安装、免费代次必须匹配；不接受客户端自行申请或选择 bit。
        先持久化状态并冻结领取，苹果确认仅清 bit0 后，事务撤销旧免费来源并增加代次。
        保留 bit1、付费来源和审计；苹果写入与数据库之间失败要保持待核查并补偿。
        已完成操作只返回当前快照，绝不再次写 bit0；旧代次领取不能复活。
      parameters:
        - {$ref: '#/components/parameters/ResetId'}
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, nonce, deviceToken, expectedGeneration]
              properties:
                challengeId: {type: string, format: uuid}
                nonce: {type: string}
                deviceToken: {type: string, format: byte, maxLength: 16384}
                expectedGeneration: {$ref: '#/components/schemas/FreeGeneration'}
      responses:
        '200':
          description: 指定操作已完成；返回当前权益及免费状态，不保证此前重置后尚未再次领取
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '202': {$ref: '#/components/responses/ResetPending'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/devices/{deviceId}/ios-test-status:
    put:
      tags: [iOS Test Administration]
      operationId: setAdminIosTestDevice
      summary: 标记或取消一个 iOS 测试安装，不直接修改免费次数
      description: 仅 IOS ACTIVE 安装；有未完成重置时不能取消测试标记。原因和操作人写入审计。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isTestDevice, reason]
              properties:
                isTestDevice: {type: boolean}
                reason: {$ref: '#/components/schemas/AdminReason'}
      responses:
        '200':
          description: 测试标记已保存，免费资格不变
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, isTestDevice, freeGeneration]
                properties:
                  deviceId: {$ref: '#/components/schemas/DeviceId'}
                  isTestDevice: {type: boolean}
                  freeGeneration: {$ref: '#/components/schemas/FreeGeneration'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/devices/{deviceId}/ios-free-resets:
    post:
      tags: [iOS Test Administration]
      operationId: createAdminIosFreeReset
      summary: 为已标记测试安装创建一次免费资格重置
      description: |
        仅 IOS ACTIVE 测试安装，不能批量清空或永久豁免；需要 reason 和幂等键。
        同安装存在未决领取或未结束重置时不得创建第二个操作。
        先进入 WAITING_DEVICE，等待指定手机新证明，不能只清数据库就报告成功。
        重试同键同参数返回原操作；同键异参或 expectedGeneration 过期返回冲突。
        已完成幂等重试先返回原操作，不再次校验成新一轮重置或再次清零。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedGeneration, reason]
              properties:
                expectedGeneration: {$ref: '#/components/schemas/FreeGeneration'}
                reason: {$ref: '#/components/schemas/AdminReason'}
      responses:
        '200': {$ref: '#/components/responses/ResetResult'}
        '202': {$ref: '#/components/responses/ResetPending'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/devices/{deviceId}/ios-free-resets/{resetId}:
    get:
      tags: [iOS Test Administration]
      operationId: getAdminIosFreeReset
      summary: 查询指定测试安装重置进度
      security:
        - adminCookie: []
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ResetId'}
      responses:
        '200': {$ref: '#/components/responses/ResetResult'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/devices/{deviceId}/ios-free-resets/{resetId}/cancel:
    post:
      tags: [iOS Test Administration]
      operationId: cancelAdminIosFreeReset
      summary: 取消尚未开始苹果写入的等待重置
      description: 原子校验 WAITING_DEVICE；苹果副作用已开始的操作需核查完成，不能取消后解冻。重复取消幂等返回原结果。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ResetId'}
      responses:
        '200': {$ref: '#/components/responses/ResetResult'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /integrations/apple/app-store-notifications:
    post:
      tags: [Apple Notifications]
      operationId: receiveAppleStoreNotification
      summary: 验证并持久化 App Store Server Notifications V2
      description: |
        不使用设备/管理员会话，必须验证 Apple JWS、证书链、应用标识及环境。
        未验证 payload 不能进入业务账本。notificationUUID 去重，持久化后确认接收，异步应用并重试。
        退款/撤销按交易来源同步到各恢复安装，保留独立免费权益；防止乱序通知覆盖最新交易事实。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              additionalProperties: false
              properties:
                signedPayload: {type: string, minLength: 10, maxLength: 131072}
      responses:
        '200':
          description: 已验签并持久化，或已处理的合法重复通知
        '400': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    deviceBearer: {type: http, scheme: bearer}
    adminCookie: {type: apiKey, in: cookie, name: QJ_ADMIN_SESSION}
    adminCsrf: {type: apiKey, in: header, name: X-CSRF-Token}
  parameters:
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: {$ref: '#/components/schemas/DeviceId'}
    ResetId:
      in: path
      name: resetId
      required: true
      schema: {type: string, format: uuid}
    AppAttestKey:
      in: header
      name: X-App-Attest-Key-Id
      required: true
      schema: {type: string, maxLength: 256}
    AppAttestAssertion:
      in: header
      name: X-App-Attest-Assertion
      required: true
      description: Base64 的 App Attest assertion，覆盖本请求原始 UTF-8 字节的 SHA256
      schema: {type: string, maxLength: 32768}
  schemas:
    DeviceId:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: 沿用管理端匿名安装记录 ID；不代表永久物理设备标识
    FreeGeneration:
      type: integer
      format: int32
      minimum: 0
      description: 安装免费代次；管理员成功重置后加一，旧代次请求不得重新发放权益
    AdminReason:
      type: string
      minLength: 1
      maxLength: 300
      description: 必填操作原因；服务端拒绝纯空白
    ResetOperation:
      type: object
      required: [resetId, status, expectedGeneration, expiresAt]
      properties:
        resetId: {type: string, format: uuid}
        status:
          type: string
          enum: [WAITING_DEVICE, PROCESSING, APPLE_RESET_CONFIRMED, COMPLETED, RETRYABLE_FAILURE, EXPIRED, CANCELLED]
        expectedGeneration: {$ref: '#/components/schemas/FreeGeneration'}
        resultingGeneration:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: 仅完成后有值；重复返回不能使代次再次增加
        expiresAt:
          type: string
          format: date-time
          description: 等待手机开始操作的截止时间；已经开始外部写入后不能因该时间到期自动解冻
        lastErrorCode:
          type: string
          nullable: true
          maxLength: 100
          description: 脱敏业务错误，不返回苹果 token 或完整证明
    WallpaperId:
      type: string
      pattern: '^[1-9][0-9]*$'
    DeviceProofRequest:
      type: object
      required: [challengeId, nonce, deviceToken]
      properties:
        challengeId: {type: string, format: uuid}
        nonce: {type: string}
        deviceToken: {type: string, format: byte, maxLength: 16384}
    AcquisitionState:
      type: object
      required: [installationId, accountToken, freeAllowance, freeGeneration, products, freeWallpaperIds, purchasedWallpaperIds]
      properties:
        installationId:
          type: string
          format: uuid
          description: anonymous_device.public_id；供管理员定位当前测试安装，不是物理设备标识或管理路径的数值 ID
        accountToken:
          type: string
          format: uuid
          description: 服务端为当前安装签发的 Apple appAccountToken；恢复交易可带原安装 token
        freeAllowance:
          type: string
          enum: [UNKNOWN, AVAILABLE, USED, UNAVAILABLE]
          description: AVAILABLE 仅能来自有效 DeviceCheck 查询；UNKNOWN/UNAVAILABLE 不授予免费资格
        freeGeneration: {$ref: '#/components/schemas/FreeGeneration'}
        pendingFreeReset:
          anyOf:
            - {$ref: '#/components/schemas/ResetOperation'}
            - {type: object, nullable: true, enum: [null]}
          description: 仅本安装待处理重置；无操作时省略或 null。存在时免费状态为 UNAVAILABLE，旧客户端不能直接领取。
        products:
          type: object
          description: wallpaperId 到 Apple 非消耗型 productId 的唯一映射；不返回原始资源 URL
          additionalProperties: {type: string, minLength: 1}
        freeWallpaperIds:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/WallpaperId'}
        purchasedWallpaperIds:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/WallpaperId'}
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [IOS_ACQUISITION_UNAVAILABLE, IOS_DEVICE_PROOF_UNAVAILABLE, IOS_ATTESTATION_INVALID,
            IOS_ATTESTATION_KEY_UNKNOWN, IOS_ASSERTION_REPLAY, IOS_CHALLENGE_EXPIRED,
            IOS_FREE_ALLOWANCE_USED, IOS_FREE_CLAIM_PENDING, IDEMPOTENCY_CONFLICT,
            IOS_FREE_CLAIM_RESET, IOS_FREE_RESET_PENDING, IOS_FREE_GENERATION_CONFLICT,
            IOS_TEST_DEVICE_REQUIRED, IOS_FREE_RESET_NOT_FOUND, IOS_FREE_RESET_NOT_CANCELLABLE,
            IOS_PURCHASE_INVALID, IOS_PURCHASE_ENVIRONMENT_INVALID, IOS_PRODUCT_UNAVAILABLE,
            WALLPAPER_UNAVAILABLE, UNAUTHORIZED, FORBIDDEN, VALIDATION_FAILED,
            APPLE_NOTIFICATION_INVALID, RATE_LIMITED, INTERNAL_ERROR]
        message: {type: string}
  responses:
    ResetResult:
      description: 指定重置操作的当前状态，不包含设备凭证或购买数据
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ResetOperation'}
    ResetPending:
      description: 操作已接受但未完成；客户端退避刷新，不重新创建重置或提前显示免费可用
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ResetOperation'}
    Error:
      description: 确定的拒绝或可重试错误；未知状态不得发放权益，响应中不得泄露密钥或原始文件
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
