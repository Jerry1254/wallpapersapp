openapi: 3.0.3
info:
  title: 倾境壁纸 API
  version: 2.27.0
  license:
    name: Proprietary
    url: https://github.com/Jerry1254/wallpapersapp
  description: |
    倾境壁纸正式 App 与管理后台共用的 V1 契约。

    所有 Long ID 在 JSON 中使用字符串；所有时间均为带时区的 ISO 8601 字符串。
    公开目录仅返回封面和能力描述，不返回存储键、绝对路径、内容密钥或正式资源永久地址。
    wallpaper.offlinePromotionOnly=true 的作品仅对已登记 Android com.jiyi.wallpaper（吉意壁纸）渠道可见。
    正式三端、其他安装范围及匿名资源请求按 ONLINE 过滤；渠道来自服务器设备记录，不接受客户端 channel 切换。
    列表、分类计数、详情、权益、兑换、预览和下载均执行当前策略，先前已签发的票据不绕过新策略。
servers:
  - url: /api/v1
    description: 当前来源下的 V1 API；本地联调默认由开发代理转发到 API Server
security: []
tags:
  - name: Public Legal
    description: 倾境协议已发布文本
  - name: Admin Legal
    description: 隐私政策和用户协议草稿及发布
  - name: Admin Creator Wallpapers
    description: 创作台壁纸上传与持久上架，不包含编辑器项目或渲染
  - name: App Updates
    description: 三端独立版本、强制门槛与Android APK更新
  - name: Admin App Releases
    description: 上传或登记草稿、发布、关闭强制和弃用版本
  - name: Public Catalog
    description: 按已认证安装包平台返回已发布资源能力与封面
  - name: Public Tutorial
    description: 无需设备会话的壁纸设置教程与视频流
  - name: Device Identity
    description: 匿名设备注册、挑战和短期会话
  - name: Device Entitlement
    description: 兑换、权益与下载描述
  - name: Admin Session
    description: 单管理员会话
  - name: Admin Asset
    description: 受控文件上传与元数据查询
  - name: Admin Catalog
    description: 分类、壁纸、平台变体与资源版本
  - name: Admin Tutorial
    description: 五个固定壁纸设置教程槽位的视频、启停与排序
  - name: Admin Redemption
    description: 兑换码批次、兑换事件、设备与权益查询
  - name: iOS Acquisition
    description: iOS App Attest、首次免费与 Apple 非消耗型内购
  - name: iOS Test Administration
    description: iOS 商品映射、测试安装标记与一次性首免重置
  - name: Apple Notifications
    description: App Store Server Notifications V2 验签入口

  - name: Device Support
    description: 当前设备自己的在线客服会话与消息
  - name: Admin Support
    description: 电脑与独立安卓客服共用的会话和素材管理
  - name: Support Media
    description: 单文件短期授权的客服媒体访问

  - name: Admin Security
    description: 自动规则、永久黑名单、管理员解除及测试白名单
  - name: Device Security
    description: 用户端最小恢复检查和本机环境信号

  - name: Admin Operations
    description: 用户设备管理与北京时间运营统计
  - name: Device Operations
    description: 隐私同意和安全验证后的前台使用采集

paths:
  /public/legal-documents:
    get:
      tags: [Public Legal]
      operationId: getPublishedLegalDocuments
      summary: 匿名读取倾境已发布协议，不含草稿
      description: 同意前唯一协议请求，不需要设备标识、凭据或会话。只用于展示公开文本，响应禁止缓存。consentVersion 在重大变更发布时更新，普通文字修订不要求重新同意。
      security: []
      responses:
        '200':
          description: 隐私政策和用户协议的已发布快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLegalDocuments'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/legal-documents:
    get:
      tags: [Admin Legal]
      operationId: listAdminLegalDocuments
      summary: 读取协议草稿及当前发布版本
      security:
        - adminCookie: []
      responses:
        '200':
          description: 两个固定协议槽位
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminLegalDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/legal-documents/{key}:
    put:
      tags: [Admin Legal]
      operationId: saveLegalDocumentDraft
      summary: 保存协议草稿，不影响公开内容
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/LegalDocumentKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, requiresReconsent]
              properties:
                content:
                  $ref: '#/components/schemas/LegalContent'
                requiresReconsent:
                  type: boolean
                  description: 下次发布重大变更时提高 consentRevision
      responses:
        '200':
          description: 已保存草稿
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLegalDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/legal-documents/{key}/publish:
    post:
      tags: [Admin Legal]
      operationId: publishLegalDocument
      summary: 发布草稿并保留历史快照
      description: 内容没有变化时不创建新版本。普通变更仅提高 revision；重大变更同时提高 consentRevision。发布完成后清除 requiresReconsent 标记。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/LegalDocumentKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 当前发布结果
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLegalDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/categories:
    get:
      tags: [Public Catalog]
      operationId: listPublicCategories
      summary: 查询公开两级分类树
      security:
        - deviceBearer: []
      responses:
        '200':
          description: 已发布内容对应的分类树
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicRootCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/wallpapers:
    get:
      tags: [Public Catalog]
      operationId: listPublicWallpapers
      summary: 查询、筛选或搜索已发布壁纸
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: rootCategoryId
          in: query
          schema:
            $ref: '#/components/schemas/LongId'
        - name: childCategoryId
          in: query
          description: 提供时必须属于 rootCategoryId；未提供 rootCategoryId 时请求无效。
          schema:
            $ref: '#/components/schemas/LongId'
        - name: deliveryPlatform
          in: query
          description: 必须与 resourceType 同时提供，按作品已发布的精确资源组合在计数和分页前筛选商品。
          schema:
            $ref: '#/components/schemas/DeliveryPlatform'
        - name: resourceType
          in: query
          description: 必须与 deliveryPlatform 同时提供，只接受契约定义的五种平台/资源组合。
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: view
          in: query
          description: 系统视图。FEATURED 由 featuredRank 计算，可与精确能力筛选叠加。
          schema:
            type: string
            enum: [FEATURED]
        - name: accessType
          in: query
          schema:
            $ref: '#/components/schemas/WallpaperAccessType'
        - name: q
          in: query
          description: 壁纸标题或受控关键词；去除首尾空格后长度为 1 至 40。
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: sort
          in: query
          schema:
            type: string
            enum: [DEFAULT, NEWEST]
            default: DEFAULT
      responses:
        '200':
          description: 壁纸分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWallpaperPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/wallpapers/{wallpaperId}:
    get:
      tags: [Public Catalog]
      operationId: getPublicWallpaper
      summary: 查询已发布壁纸详情
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/WallpaperId'
      responses:
        '200':
          description: 壁纸详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWallpaperDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallpapers/{wallpaperId}/cover:
    get:
      tags: [Public Catalog]
      operationId: readWallpaperPreviewCover
      summary: 按作品当前预览策略读取封面
      description: |
        普通作品无需设备会话；仅返回已发布且当前渠道可见的预览封面。免费壁纸无水印；付费壁纸默认有水印，管理员可关闭。
        仅线下作品需要吉意壁纸有效 deviceBearer；匿名或正式三端请求返回404，提供无效会话返回401。
        revision 仅用于客户端缓存分代，不允许读取旧策略或正式原图。预览尚在生成或失败时拒绝返回，不回退原图。
      security: [{}, {deviceBearer: []}]
      parameters:
        - $ref: '#/components/parameters/WallpaperId'
        - name: revision
          in: query
          required: false
          description: 公开目录返回的 previewRevision；仅作为缓存版本标识，服务端始终执行当前策略。
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: 当前策略下的预览封面；水印衍生图为 PNG，关闭水印时保持原图 MIME。
          headers:
            Cache-Control:
              description: 禁止客户端和代理缓存跨策略复用的封面内容。
              schema:
                type: string
                enum: [no-store]
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
            image/svg+xml:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/PreviewUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/assets/{assetId}/content:
    get:
      tags: [Public Catalog]
      operationId: readPublicAssetContent
      summary: 读取允许公开展示的分类图标或壁纸封面
      description: |
        仅 Asset 被已发布目录投影引用且角色允许公开展示时返回文件字节。
        关联付费且开启水印的壁纸时禁止回源原图；作品策略无歧义时可返回当前水印衍生封面。
        同一封面被多个不同预览策略的壁纸或分类复用时拒绝请求，客户端改用按作品隔离的 /wallpapers/{wallpaperId}/cover。
        生成未完成或失败时拒绝返回，不回退干净源；付费水印预览使用 Cache-Control: no-store。
        可选 deviceBearer 决定可见渠道；匿名或正式三端不得读取仅线下作品封面（即使复用为分类图标）。
      security: [{}, {deviceBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 文件内容
          headers:
            ETag:
              description: 文件内容摘要对应的缓存标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/PreviewUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/wallpaper-tutorials:
    get:
      tags: [Public Tutorial]
      operationId: listPublicWallpaperTutorials
      summary: 查询已启用的壁纸设置教程
      description: 仅返回已启用且视频资产已就绪的固定教程槽位，按 sortOrder 排序。
      responses:
        '200':
          description: 可用教程列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicWallpaperTutorial'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/wallpaper-tutorials/{tutorialKey}/video:
    get:
      tags: [Public Tutorial]
      operationId: streamPublicWallpaperTutorialVideo
      summary: 读取教程 MP4 视频流
      description: 支持单段 bytes Range；请求与响应字节边界必须精确。v 用于版本化缓存地址；仅当前版本可长缓存，缺失或旧版本返回当前内容并要求缓存重新验证。
      parameters:
        - $ref: '#/components/parameters/TutorialKey'
        - name: v
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Range
          in: header
          description: 单段 bytes 范围，例如 bytes=0-1023。
          schema:
            type: string
        - name: If-Range
          in: header
          description: 仅匹配当前强 ETag 时返回分段；不匹配时返回完整内容。
          schema: { type: string }
      responses:
        '200':
          description: 完整 MP4 内容
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Length:
              schema: { type: integer, format: int64 }
            ETag:
              schema: { type: string }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '206':
          description: 指定字节范围的 MP4 内容
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Length:
              schema: { type: integer, format: int64 }
            Content-Range:
              schema: { type: string }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Range 无法满足
          headers:
            Content-Range:
              schema: { type: string }
              description: 当前资源长度，例如 bytes */1024。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags: [Public Tutorial]
      operationId: inspectPublicWallpaperTutorialVideo
      summary: 查询教程 MP4 的字节与缓存元数据
      description: HEAD 忽略 Range 并返回完整内容长度，不返回响应体。
      parameters:
        - $ref: '#/components/parameters/TutorialKey'
        - name: v
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: 完整内容元数据
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Length:
              schema: { type: integer, format: int64 }
            ETag:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/registrations:
    post:
      tags: [Device Identity]
      operationId: registerDevice
      summary: 注册或重新关联匿名设备凭据
      description: |
        正式 App 提交平台公钥和设备证明。
        Android 使用 SEC-002 安装级 RSA 2048 持钥证明；同公钥新证明恢复原 ACTIVE 凭据，撤销后不可重建。
        HarmonyOS 使用 HUKS RSA-2048、SHA-256 和 PKCS#1 v1.5，固定 appInstallScope 为 com.qingjing.bizhi。
        iOS 使用 Secure Enclave P-256、ECDSA SHA-256 和 ASN.1 DER 签名，允许正式包 com.qingjing.bizhi
        及联调包 com.qingjing.livephotolab。
        证明不等同硬件或 APK 来源认证，清数据/卸载后不自动恢复旧权益。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
      responses:
        '201':
          description: 新凭据已创建或已有设备已关联
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/session-challenges:
    post:
      tags: [Device Identity]
      operationId: createDeviceSessionChallenge
      summary: 申请一次性设备会话挑战
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialKeyId]
              properties:
                credentialKeyId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: 挑战已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSessionChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/sessions:
    post:
      tags: [Device Identity]
      operationId: createDeviceSession
      summary: 使用挑战证明换取短期设备会话
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceSessionRequest'
      responses:
        '201':
          description: 设备会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/encryption-key:
    put:
      tags: [Device Identity]
      operationId: bindDeviceEncryptionKey
      summary: 以当前安装签名身份固定绑定独立解密公钥
      description: Android RSA-2048 解密公钥；签署精确正文。同公钥重复绑定幂等，不允许替换已绑定公钥。保留原
        credentialKeyId 和权益。
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/RequestSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindEncryptionKeyRequest'
      responses:
        '200':
          description: 已绑定公钥摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionKeyBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/me/entitlements:
    get:
      tags: [Device Entitlement]
      operationId: listMyEntitlements
      summary: 查询当前设备已获得的壁纸
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前设备有效权益分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/redemptions:
    post:
      tags: [Device Entitlement]
      operationId: redeemWallpaper
      summary: 使用兑换码为当前设备获得壁纸
      description: |
        Idempotency-Key 在同一设备内唯一。相同键与相同请求体返回原最终结果；相同键异参返回 409。
        只有 GRANTED 消耗一次额度；ALREADY_OWNED 的 quotaDelta 为 0。
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/AppVersionName'
        - $ref: '#/components/parameters/AppVersionCode'
        - $ref: '#/components/parameters/AppAbi'
        - $ref: '#/components/parameters/AppAndroidSdk'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/RequestSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemWallpaperRequest'
      responses:
        '426': {$ref: '#/components/responses/AppUpdateRequired'}
        '200':
          description: 已存在的幂等结果，或设备原本已拥有壁纸
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResult'
        '201':
          description: 新权益已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResult'
        '202':
          description: 请求仍在处理中；客户端保留原 key 并查询确认
          content:
            application/json:
              schema:
                type: object
                required: [status, idempotencyKey]
                properties:
                  status:
                    type: string
                    enum: [PROCESSING]
                  idempotencyKey:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 兑换结果为业务拒绝；响应体仍保存为该幂等请求的最终结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResult'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/redemptions/{idempotencyKey}:
    get:
      tags: [Device Entitlement]
      operationId: getRedemptionResult
      summary: 按幂等键确认兑换最终结果
      security:
        - deviceBearer: []
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已有最终结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResult'
        '202':
          description: 请求仍在恢复或处理中
          content:
            application/json:
              schema:
                type: object
                required: [status, idempotencyKey]
                properties:
                  status:
                    type: string
                    enum: [PROCESSING]
                  idempotencyKey:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/wallpapers/{wallpaperId}/download-tickets:
    post:
      tags: [Device Entitlement]
      operationId: createDownloadTicket
      summary: 为已获得壁纸签发短时下载描述
      description: |
        客户端必须选择详情 availableCapabilities 中的精确 deliveryPlatform/resourceType 组合。
        服务端不做跨平台或资源类型回退，也不读取设备能力档案；只校验权益、资源已发布及交付文件可用。
        UNIVERSAL / STATIC_IMAGE 对所有平台开放；Android 延续安全包交付，HarmonyOS 和 iOS 会话领取原始静态图。
        HARMONYOS / MOVING_PHOTO 返回 JPEG + MP4；IOS / LIVE_PHOTO 只返回受权益保护的原始 MP4 描述。
        iOS 客户端取原始 MP4 的前 60 个显示帧，本地一次编码为 60 fps / 1 秒 Live Photo。
        未兑换预览仍使用独立预览票据和后端标准化 MOV，不暴露原始 MP4。
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/AppVersionName'
        - $ref: '#/components/parameters/AppVersionCode'
        - $ref: '#/components/parameters/AppAbi'
        - $ref: '#/components/parameters/AppAndroidSdk'
        - $ref: '#/components/parameters/WallpaperId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/RequestSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDownloadTicketRequest'
      responses:
        '426': {$ref: '#/components/responses/AppUpdateRequired'}
        '201':
          description: 下载描述已签发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadDescriptor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery/files:
    get:
      tags: [Device Entitlement]
      operationId: downloadProtectedFile
      summary: 使用短时票据读取受保护交付文件
      description: Authorization Bearer ticket 是 60 至 120 秒有效、限定设备和资源版本的不可猜测字符串。
      security:
        - downloadTicketBearer: []
      responses:
        '200':
          description: 加密资源包字节
          headers:
            Digest:
              description: '密文摘要，例如 sha-256=:base64:'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 票据已过期或已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery/moving-photo/poster:
    get:
      tags: [Device Entitlement]
      operationId: downloadMovingPhotoPoster
      summary: 使用鸿蒙短时票据下载 Moving Photo JPEG 首帧
      security:
        - downloadTicketBearer: []
      responses:
        '200':
          description: 与同一资源视频配套的 JPEG 首帧；不构成通用静态壁纸。
          headers:
            Digest:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /delivery/moving-photo/video:
    get:
      tags: [Device Entitlement]
      operationId: downloadMovingPhotoVideo
      summary: 使用鸿蒙短时票据下载 Moving Photo H.264 MP4
      security:
        - downloadTicketBearer: []
      responses:
        '200':
          description: 最长 2 秒的 H.264 MP4
          headers:
            Digest:
              schema: { type: string }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /delivery/live-photo/image:
    get:
      deprecated: true
      tags: [Device Entitlement]
      operationId: downloadLegacyLivePhotoImage
      summary: 使用 iOS 短时票据下载旧版 Live Photo HEIC
      description: 仅用于旧客户端过渡；OpenAPI 2.13.0 起的 iOS 客户端不再调用。
      security:
        - downloadTicketBearer: []
      responses:
        '200':
