        - coverMaximumBytes
        - coverMimeTypes
        - supportedMetadataFields
        - supportedIosAcquisitionFields
        - supportedOperations
      properties:
        environment:
          $ref: "#/components/schemas/CreatorWallpaperEnvironment"
        rulesVersion:
          type: string
        wallpaperVariants:
          type: array
          items:
            $ref: "#/components/schemas/CreatorWallpaperVariantRule"
        coverMaximumBytes:
          type: integer
          format: int64
        coverMimeTypes:
          type: array
          items:
            type: string
        supportedMetadataFields:
          type: array
          items:
            type: string
        supportedIosAcquisitionFields:
          type: array
          items:
            type: string
        supportedOperations:
          type: object
          additionalProperties:
            type: boolean
    CreatorWallpaperResource:
