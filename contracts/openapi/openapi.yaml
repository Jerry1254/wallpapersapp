          pattern: ^[A-Za-z0-9_-]{43}$
          readOnly: true
        downloadUrl:
          type: string
          enum:
            - /api/v1/preview/files
        expiresAt:
          type: string
          format: date-time
        resourceVersion:
          $ref: "#/components/schemas/DownloadResourceVersion"
        package:
          $ref: "#/components/schemas/PreviewPackageMetadata"
