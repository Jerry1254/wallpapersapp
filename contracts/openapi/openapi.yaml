  /device/wallpapers/{wallpaperId}/preview-tickets:
    post:
      tags:
        - Device Entitlement
      operationId: createPreviewTicket
      summary: 为 App 按精确资源类型签发详情效果预览描述
      description: |
        需设备会话与持钥签名，无需权益，不扣兑换额度。服务端按请求的 deliveryPlatform/resourceType 精确选择已发布资源，不读取设备能力档案，也不跨类型回退。
        Android、通用资源使用当前 previewRevision 的 APP_PREVIEW 加密包，内含独立生成的预览素材；4D 只在最前面的图层烧录水印，其他图层保持正常景深效果。
        IOS/LIVE_PHOTO 从 live_photo_package 标准化 MOV 生成独立预览视频，保持 IntoLive 前 60 帧顺序、60 fps、精确 1 秒；付费且开启水印时每帧烧录“预览专用”。使用独立短时预览票据，不读取源 MP4，也不产生权益或正式下载记录。
        HarmonyOS/MOVING_PHOTO 返回保持原尺寸、帧率和不超过 2 秒时长的独立预览 MP4，付费且开启水印时每帧烧录水印。鸿蒙 App 缓存后自动播放一次，结束后仅由用户点击重新播放；正式保存仍使用下载接口交付 JPEG 与 MP4 两个文件。
        免费壁纸的预览无水印；付费默认有水印，管理员可关闭。策略变化和重建后旧代次票据不得继续读取；生成未完成或失败时返回 503，不回退正式资源。
        所有预览票据有效 90 秒；Android App 的解密预览窗口仍由客户端单调时钟限制为 120 秒。
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/WallpaperId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestTimestamp"
        - $ref: "#/components/parameters/RequestNonce"
        - $ref: "#/components/parameters/RequestSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePreviewTicketRequest"
      responses:
        "201":
          description: 独立试用描述已签发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewDescriptor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/PreviewUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /preview/files:
    get:
      tags:
        - Device Entitlement
      operationId: downloadPreviewFile
      summary: 使用独立试用票据读取受限预览包
      description: 只接受 previewTicketBearer；正式 downloadTicketBearer
        被拒绝。认证来自短时票据及活跃安装凭据，不产生权益。
      security:
        - previewTicketBearer: []
      responses:
        "200":
          description: QJPV0001 / format 3、purpose=APP_PREVIEW 的加密受限素材
          headers:
            Digest:
              description: "密文摘要，例如 sha-256=:base64:"
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: 票据已过期或已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /preview/moving-photo/video:
    get:
      tags:
