    CreatePreviewTicketRequest:
      type: object
      required:
        - platform
        - resourceType
      properties:
        platform:
          type: string
          enum:
            - ANDROID
        osVersion:
          type: string
          maxLength: 32
        resourceType:
          type: string
          enum:
            - STATIC_IMAGE
            - VIDEO
            - LAYER_PARALLAX
    PreviewPackageMetadata:
      type: object
      required:
        - formatVersion
        - sizeBytes
        - plaintextSizeBytes
        - encryptedSha256
        - plaintextSha256
        - signingKeyId
        - encryptionKeySha256
        - wrappedContentKey
        - keyAlgorithm
      properties:
        formatVersion:
          type: integer
          enum:
            - 3
        plaintextSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 68157404
        plaintextSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        signingKeyId:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
        encryptionKeySha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        sizeBytes:
          type: integer
          format: int64
          minimum: 37
          maximum: 68157440
        encryptedSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        wrappedContentKey:
          type: string
          minLength: 342
          maxLength: 342
          pattern: ^[A-Za-z0-9_-]{342}$
          readOnly: true
        keyAlgorithm:
          type: string
          enum:
            - RSA-OAEP-SHA256-MGF1-SHA1
    PreviewDescriptor:
      type: object
      required:
        - deliveryMode
        - purpose
        - durationSeconds
        - wallpaperId
        - ticket
        - downloadUrl
        - expiresAt
        - resourceVersion
        - package
      properties:
        deliveryMode:
          type: string
