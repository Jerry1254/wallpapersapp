      properties:
        formatVersion:
          type: integer
          enum: [2]
        plaintextSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 68157404
        plaintextSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        signingKeyId:
          type: string
          pattern: '^[a-z0-9-]{1,64}$'
        encryptionKeySha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sizeBytes:
