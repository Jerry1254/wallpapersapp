    WallpaperPublicationCheckResult:
      type: object
      additionalProperties: false
      required:
        - wallpaperId
        - wallpaperVersion
        - canPrepare
        - canPublish
        - checks
      properties:
        wallpaperId:
          $ref: "#/components/schemas/LongId"
        wallpaperVersion:
          type: integer
          format: int64
        canPrepare:
          type: boolean
        canPublish:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/WallpaperPublicationCheck"
    CreatorWallpaperMetadata:
      type: object
      required:
        - title
        - slug
        - accessType
        - rootCategoryId
        - coverAssetId
        - sortOrder
        - copyrightNote
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 40
        slug:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        accessType:
          $ref: "#/components/schemas/WallpaperAccessType"
        offlinePromotionOnly:
          type: boolean
          default: false
          description: 仅吉意壁纸 Android 线下推广使用；默认 false，PATCH省略保留现值。true时正式Android/iOS/Harmony及匿名入口均不可见，服务端按当前策略检查；不改变收费、水印和资源生成。
        previewWatermarkEnabled:
          type: boolean
          default: true
          description: 创建时未提供默认为 true；PATCH 未提供时保留原开关。只有 accessType=REDEEM 且开关为 true 时添加水印，免费始终无水印。切换开关或收费规则会异步重新生成预览。
        rootCategoryId:
          $ref: "#/components/schemas/LongId"
        childCategoryId:
          type: string
          allOf:
            - $ref: "#/components/schemas/LongId"
          nullable: true
          description: 提供时必须是 rootCategoryId 的直接子节点；数据库只保存这个最深节点。
        coverAssetId:
          $ref: "#/components/schemas/LongId"
        featuredRank:
          type: integer
          minimum: 0
          maximum: 999999
          nullable: true
        sortOrder:
          type: integer
          minimum: 0
          maximum: 999999
        copyrightNote:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false

