        uploadPurpose:
          type: string
        requiredRole:
          type: string
        acceptedMimeTypes:
          type: array
          items:
            type: string
        maximumBytes:
          type: integer
          format: int64
          minimum: 1
        source:
          type: object
          additionalProperties: true
        preview:
          type: object
          additionalProperties: true
    CreatorWallpaperCapabilities:
      type: object
