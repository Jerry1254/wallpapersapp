  /delivery/live-photo/source:
    get:
      tags: [Device Entitlement]
      operationId: downloadLivePhotoSource
      summary: 使用 iOS 短时正式下载票据读取原始 MP4
      description: |
        只向通过 iOS 设备会话、持钥签名、资源发布状态和付费壁纸权益校验后签发的 downloadTicketBearer 开放。
        返回运营上传的原始 MP4，不做预先 HEVC 转码；客户端只使用前 60 个显示帧完成一次最终编码。
        禁止重定向，响应必须携带 Cache-Control: no-store 和与下载描述一致的 Content-Length / Digest。
      security:
        - downloadTicketBearer: []
      responses:
        '200':
          description: 受保护的原始 MP4
          headers:
            Digest:
              schema: { type: string }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /delivery/static-image:
    get:
      tags: [Device Entitlement]
      operationId: downloadStaticImage
      summary: 使用短时票据下载通用静态原图
      description: |
        返回运营发布的 UNIVERSAL / STATIC_IMAGE 原始文件，支持 JPEG、PNG 和 WebP。
        该文件不是列表封面或缩略图；客户端必须校验响应 Digest 或下载描述中的 SHA-256。
      security:
        - downloadTicketBearer: []
      responses:
        '200':
          description: 通用静态原图
          headers:
            Digest:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

