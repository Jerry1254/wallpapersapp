          type: array
          items:
            $ref: "#/components/schemas/CreatorWallpaperResource"
          maxItems: 5
        retainResourceVersionIds:
          type: array
          items:
            $ref: "#/components/schemas/LongId"
          maxItems: 20
          uniqueItems: true
        iosAcquisition:
          type: object
          allOf:
            - $ref: "#/components/schemas/CreatorIosAcquisitionRequest"
