      summary: 立即从 Apple 同步当前中国区价格
      description: 仅查询 Apple 已生效的 customerPrice，不修改 Apple 定价。不接受金额参数；自动任务也使用同一同步服务。
      security: [{adminCookie: [], adminCsrf: []}]
      parameters:
        - in: path
          name: wallpaperId
          required: true
          schema: {$ref: '#/components/schemas/WallpaperId'}
      responses:
        '200':
          description: 当前配置与同步结果；Apple 失败时 priceSyncStatus 为 ERROR，不返回未经确认的金额
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IosProductConfiguration'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}

  /app-updates/check:
    get:
      tags: [App Updates]
      operationId: checkAppUpdate
      summary: 无需会话检查当前安装版本
      description: |
        仅 PUBLISHED 版本生效。最新目标和强制门槛分别计算；DRAFT/DEPRECATED 均不参与。
        android/harmony 使用 versionCode，iOS 使用数字营销 versionName（忽略同营销版不同build）。
        Android 传 ABI/SDK 时以最高兼容版本为目标，无法到达强制门槛不拦截。
        Cache-Control 为 no-store；首次请求失败不能自行判定必须更新。
      security: []
      parameters:
        - name: packageName
          in: query
          description: 实际package/bundleId；Android com.qingjing.bizhi与com.jiyi.wallpaper各自独立版本与强制门槛。未提供默认倾境；其他包无更新。此公开参数只决定显示，业务拦截使用已认证设备库中的app_install_scope。
          schema: {type: string, maxLength: 255}
        - name: platform
          in: query
          required: true
          schema: {$ref: '#/components/schemas/AppReleasePlatform'}
        - name: versionName
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: versionCode
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        - name: abi
          in: query
          schema: {type: string, enum: [arm64-v8a, armeabi-v7a, x86, x86_64]}
        - name: androidSdk
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        '200':
          description: 当前规则判断，nullable版本字段在无生效版本时为null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppUpdateCheckEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}

  /app-updates/packages/{releaseId}:
    get:
      tags: [App Updates]
      operationId: downloadPublishedAppApk
      summary: 下载已发布Android APK（支持单Range断点）
      description: 只能按版本ID读取PUBLISHED Android APK，不接收存储路径；草稿和弃用包返回404，不暴露其他资源。支持If-Range SHA-256 ETag。
      security: []
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/LongId'}
        - name: Range
          in: header
          schema: {type: string, example: 'bytes=1048576-'}
        - name: If-Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: 完整APK；Accept-Ranges为bytes，Cache-Control为no-store
          content:
            application/vnd.android.package-archive:
              schema: {type: string, format: binary}
        '206':
          description: APK单字节范围；包含Content-Range、Content-Length与ETag
          content:
            application/vnd.android.package-archive:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416':
          description: 无效、多段或不可满足Range；Content-Range为bytes */文件长度
        '500': {$ref: '#/components/responses/InternalError'}

  /admin/app-releases:
    get:
      tags: [Admin App Releases]
      operationId: listAdminAppReleases
      summary: 查询指定平台全部版本记录
      security: [{adminCookie: []}]
      parameters:
        - name: platform
          in: query
          required: true
          schema: {$ref: '#/components/schemas/AppReleasePlatform'}
        - name: packageName
          in: query
          description: Android 应用选择，默认倾境；两款 App 版本及强制门槛独立。iOS/Harmony 省略。
