      operationId: downloadMovingPhotoPreviewVideo
      summary: 使用独立试用票据读取鸿蒙动态照片的视频片段
      description: 仅接受由 HARMONYOS / MOVING_PHOTO 预览描述签发的 previewTicketBearer；票据绑定活跃鸿蒙安装凭据和已发布资源版本，不产生权益。
      security:
        - previewTicketBearer: []
      responses:
        "200":
          description: 不超过 2 秒的 H.264 MP4 动态照片视频片段
          headers:
            Digest:
              description: "视频摘要，例如 sha-256=:base64:"
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /preview/live-photo/video:
    get:
      tags:
        - Device Entitlement
      operationId: downloadLivePhotoPreviewVideo
      summary: 使用独立预览票据读取 iOS Live Photo 的 60 帧标准化 MOV
      description: 仅接受由 IOS / LIVE_PHOTO 预览描述签发的 previewTicketBearer；票据绑定活跃 iOS 安装凭据、精确 Bundle ID、已发布资源版本和视频存储元数据，不产生权益。视频保持源素材前 60 个显示帧的顺序并重定时为 60 fps / 1 秒。
      security:
        - previewTicketBearer: []
      responses:
        "200":
          description: live_photo_package 中时长精确为 1 秒的成品 MOV
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
                minimum: 1
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Digest:
              description: "视频摘要，例如 sha-256=:base64:"
              schema:
                type: string
          content:
            video/quicktime:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /device/ios/attestation/challenges:
    post:
      tags: [iOS Acquisition]
      operationId: createIosAcquisitionChallenge
      summary: 创建绑定安装、App Attest 密钥、动作和目标壁纸的一次性挑战
      description: |
        所有 POST 沿用现有 deviceBearer 和 P256 敏感请求验签，不能只核验 Bearer。
        ENROLL 返回完整且不应被客户端改写的 clientData，服务端验证其 SHA256 与 attestation nonce。
        其他动作返回 nonce；断言覆盖业务请求的原始 UTF-8 JSON 字节。
        挑战最长 120 秒，仅能使用一次；绑定 keyId、安装、动作、壁纸和当前免费代次，拒绝跨请求复用。
        FREE_RESET 必须提供 resetId 并绑定当前安装待处理操作；其他动作不接受 resetId。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId, action]
              additionalProperties: false
              properties:
                keyId: {type: string, minLength: 1, maxLength: 256}
                action: {type: string, enum: [ENROLL, STATUS, FREE_CLAIM, PURCHASE_SYNC, FREE_RESET, CREDIT_ORDER, CREDIT_RESTORE, CREDIT_CANCEL]}
                wallpaperId: {$ref: '#/components/schemas/WallpaperId'}
                resetId: {type: string, format: uuid}
      responses:
        '200':
          description: 新鲜随机挑战；ENROLL 必须包含 clientData
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, nonce, expiresAt]
                properties:
                  challengeId: {type: string, format: uuid}
                  nonce: {type: string, minLength: 32}
                  clientData: {type: string, maxLength: 32768}
                  expiresAt: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/attestation/registrations:
    post:
      tags: [iOS Acquisition]
      operationId: registerIosAttestation
      summary: 验证并绑定当前安装的 App Attest 密钥
      description: |
        服务端验证 Apple App Attestation Root CA 链、nonce、rpIdHash、凭据公钥与 keyId、aaguid 环境及计数器。
        App ID prefix 和 Bundle ID 来自可信服务端配置，不能取客户端 scope 作为依据，也不能无条件以 Team ID 代替 prefix。
        挑战和注册提交以事务/幂等记录协调；失败不能标记注册成功。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId, challengeId, attestation]
              additionalProperties: false
              properties:
                keyId: {type: string, maxLength: 256}
                challengeId: {type: string, format: uuid}
                attestation: {type: string, format: byte, maxLength: 32768}
      responses:
        '200':
          description: 密钥已绑定当前安装
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                properties:
                  registered: {type: boolean, enum: [true]}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/products:
    get:
      tags: [iOS Acquisition]
      operationId: getIosProductCatalogue
      summary: 查询已启用商品与人民币展示价
      description: |
        仅需有效 iOS 设备会话；不执行 App Attest、DeviceCheck 首免查询或恢复购买。
        展示价由服务端从 App Store Connect 自动同步，不接受手工金额，不作为支付金额、购买凭证或下载授权。
        实际扣款仍由 StoreKit 对应账号地区的商品决定，不限制账号地区。
      security: [{deviceBearer: []}]
      responses:
        '200':
          description: 最新商品映射与中国区参考价格
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IosProductCatalogue'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/status:
    post:
      tags: [iOS Acquisition]
      operationId: getIosAcquisitionState
      summary: 查询真实设备的免费资格和本次安装权益
      parameters:
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceProofRequest'}
      responses:
        '200':
          description: 服务端已验证挑战、断言计数器及苹果 DeviceCheck 状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/free-claims:
    post:
      tags: [iOS Acquisition]
      operationId: claimIosFirstFreeWallpaper
      summary: 幂等领取一张首次免费壁纸
      description: |
        以 requestId + 当前安装 + wallpaperId 记录幂等业务事实，重试使用新挑战但相同 requestId。
        同一 idempotency 目标不许换壁纸，已提交结果直接返回，不再次扣免费资格。
        领取前核验当前官方 App/设备证明、DeviceCheck bit0 以及 MySQL 状态；领取后确认为已使用。
        更新 DeviceCheck 与提交 MySQL 存在外部事务窗口，必须记录处理中状态、补偿与原目标重试能力。
        同安装请求锁只能处理本安装并发，不能伪称能完全解决同一物理设备跨安装的竞态。
        资格按获取一张壁纸消耗，不按下载次数消耗；后续同安装下载仍校验权益。
        409 IOS_FREE_ALLOWANCE_USED 必须是确定未发放该幂等请求的拒绝；结果未知返回其他可重试错误。
        存在未完成重置时拒绝新领取；challenge 绑定的免费代次必须仍有效。
        已被重置撤销的旧 requestId 返回 IOS_FREE_CLAIM_RESET，不重新发放免费来源。
      parameters:
        - $ref: '#/components/parameters/AppVersionName'
        - $ref: '#/components/parameters/AppVersionCode'
        - $ref: '#/components/parameters/AppAbi'
        - $ref: '#/components/parameters/AppAndroidSdk'
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/DeviceProofRequest'}
                - type: object
                  required: [wallpaperId, requestId]
                  properties:
                    wallpaperId: {$ref: '#/components/schemas/WallpaperId'}
                    requestId: {type: string, format: uuid}
      responses:
        '426': {$ref: '#/components/responses/AppUpdateRequired'}
        '200':
          description: 已持久化当前安装免费权益；重复请求返回同一结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/purchases:
    post:
      tags: [iOS Acquisition]
      operationId: synchronizeIosPurchasedWallpaper
      summary: 验证苹果购买或恢复交易并更新当前安装的权益
      description: |
        按可信 Apple transactionId/originalTransactionId 幂等，商品映射和正式价格由服务端和 Apple 管理。
        不接受客户端 purchased=true、壁纸 ID、客户端 environment 或价格作为购买证明。
        新购买为订单绑定的消耗型积分商品；旧非消耗型继续恢复。必须核对数量、CNY金额、CHN商店和订单appAccountToken；一笔交易只能兑换固定壁纸。
        服务端验证撤销/退款，返回免费和付费两种来源的最新快照，不能误删同壁纸独立免费权益。
        只有当前购买或有效历史恢复验证完成后才发放本安装权益；不能信任粘贴来的任意 JWT。
      parameters:
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, nonce, signedTransaction, signedAppTransaction, deviceVerificationId]
              properties:
                challengeId: {type: string, format: uuid}
                nonce: {type: string}
                signedTransaction: {type: string, minLength: 10, maxLength: 32768}
                signedAppTransaction: {type: string, minLength: 10, maxLength: 32768}
                deviceVerificationId: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: 已验签并持久化或撤销对应的安装付费权益
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/credit-orders:
    post:
      tags: [iOS Acquisition]
      operationId: createIosCreditOrder
      summary: 创建固定壁纸的积分购买订单
      description: 需要设备会话、设备签名和App Attest。验证Apple签名AppTransaction及deviceVerification。订单固定金额、积分包、数量、壁纸和专属token；客户端不能传价格。相同未完成订单幂等返回，保留价格快照。
      parameters:
        - $ref: '#/components/parameters/AppVersionName'
        - $ref: '#/components/parameters/AppVersionCode'
        - $ref: '#/components/parameters/AppAbi'
        - $ref: '#/components/parameters/AppAndroidSdk'
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, nonce, signedAppTransaction, deviceVerificationId, wallpaperId]
              properties:
                challengeId: {type: string, format: uuid}
                nonce: {type: string}
                signedAppTransaction: {type: string, minLength: 10, maxLength: 32768}
                deviceVerificationId: {type: string, minLength: 1, maxLength: 256}
                wallpaperId: {$ref: '#/components/schemas/WallpaperId'}
      responses:
        '426': {$ref: '#/components/responses/AppUpdateRequired'}
        '200':
          description: 服务端验证完成并持久化结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IosCreditOrder'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/credit-restores:
    post:
      tags: [iOS Acquisition]
      operationId: restoreIosCreditEntitlements
      summary: 通过Apple签名账户身份恢复已兑换壁纸
      description: 需要设备会话、设备签名和App Attest。验证Apple签名AppTransaction及deviceVerification。不重复发积分；先从Apple核查退款，再恢复当前安装的权益。不发放新的首免额度。
      parameters:
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, nonce, signedAppTransaction, deviceVerificationId]
              properties:
                challengeId: {type: string, format: uuid}
                nonce: {type: string}
                signedAppTransaction: {type: string, minLength: 10, maxLength: 32768}
                deviceVerificationId: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: 服务端验证完成并持久化结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/credit-orders/{orderId}/cancel:
    post:
      tags: [iOS Acquisition]
      operationId: cancelIosCreditOrder
      summary: 明确取消付款后关闭当前订单，允许重新下单
      description: 需要CREDIT_CANCEL证明及订单所属Apple账户。仅OPEN转CANCELLED；如Apple后来返回成功，仍按原价格快照交付，不能丢弃已付交易。网络异常不视为取消。
      parameters:
        - in: path
          name: orderId
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, nonce, signedAppTransaction, deviceVerificationId]
              properties:
                challengeId: {type: string, format: uuid}
                nonce: {type: string}
                signedAppTransaction: {type: string, minLength: 10, maxLength: 32768}
                deviceVerificationId: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: 服务端验证完成并持久化结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /device/ios/acquisition/free-resets/{resetId}/complete:
    post:
      tags: [iOS Acquisition]
      operationId: completeIosTestFreeReset
      summary: 指定测试手机提供新证明，推进管理员授权的一次首免重置
      description: |
        已实现；需要现有设备会话、P256 签名、App Attest 及 FREE_RESET challenge。
        resetId、keyId、当前安装、免费代次必须匹配；不接受客户端自行申请或选择 bit。
        先持久化状态并冻结领取，苹果确认仅清 bit0 后，事务撤销旧免费来源并增加代次。
        保留 bit1、付费来源和审计；苹果写入与数据库之间失败要保持待核查并补偿。
        已完成操作只返回当前快照，绝不再次写 bit0；旧代次领取不能复活。
      parameters:
        - {$ref: '#/components/parameters/ResetId'}
        - {$ref: '#/components/parameters/AppAttestKey'}
        - {$ref: '#/components/parameters/AppAttestAssertion'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, nonce, deviceToken, expectedGeneration]
              properties:
                challengeId: {type: string, format: uuid}
                nonce: {type: string}
                deviceToken: {type: string, format: byte, maxLength: 16384}
                expectedGeneration: {$ref: '#/components/schemas/FreeGeneration'}
      responses:
        '200':
          description: 指定操作已完成；返回当前权益及免费状态，不保证此前重置后尚未再次领取
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquisitionState'}
        '202': {$ref: '#/components/responses/ResetPending'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/devices/{deviceId}/ios-test-status:
    put:
      tags: [iOS Test Administration]
      operationId: setAdminIosTestDevice
      summary: 标记或取消一个 iOS 测试安装，不直接修改免费次数
      description: 仅 IOS ACTIVE 安装；有未完成重置时不能取消测试标记。原因和操作人写入审计。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [testDevice, reason]
              properties:
                testDevice: {type: boolean}
                reason: {$ref: '#/components/schemas/AdminReason'}
      responses:
        '204': {description: 测试标记已保存，免费资格不变}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/devices/{deviceId}/ios-free-resets:
    post:
      tags: [iOS Test Administration]
      operationId: createAdminIosFreeReset
      summary: 为已标记测试安装创建一次免费资格重置
      description: |
        仅 IOS ACTIVE 测试安装，不能批量清空或永久豁免；需要 reason 和幂等键。
        同安装存在未决领取或未结束重置时不得创建第二个操作。
        先进入 WAITING_DEVICE，等待指定手机新证明，不能只清数据库就报告成功。
        重试同键同参数返回原操作；同键异参或 expectedGeneration 过期返回冲突。
        已完成幂等重试先返回原操作，不再次校验成新一轮重置或再次清零。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedGeneration, reason]
              properties:
                expectedGeneration: {$ref: '#/components/schemas/FreeGeneration'}
                reason: {$ref: '#/components/schemas/AdminReason'}
      responses:
        '201': {$ref: '#/components/responses/ResetResult'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/devices/{deviceId}/ios-free-resets/{resetId}:
    get:
      tags: [iOS Test Administration]
      operationId: getAdminIosFreeReset
      summary: 查询指定测试安装重置进度
      security:
        - adminCookie: []
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ResetId'}
      responses:
        '200': {$ref: '#/components/responses/ResetResult'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/devices/{deviceId}/ios-free-resets/{resetId}/cancel:
    post:
      tags: [iOS Test Administration]
      operationId: cancelAdminIosFreeReset
      summary: 取消尚未开始苹果写入的等待重置
      description: 原子校验 WAITING_DEVICE；苹果副作用已开始的操作需核查完成，不能取消后解冻。重复取消幂等返回原结果。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ResetId'}
      responses:
        '200': {$ref: '#/components/responses/ResetResult'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /integrations/apple/app-store-notifications:
    post:
      tags: [Apple Notifications]
      operationId: receiveAppleStoreNotification
      summary: 验证并持久化 App Store Server Notifications V2
      description: |
        不使用设备/管理员会话，必须验证 Apple JWS、证书链、应用标识及环境。
        未验证 payload 不能进入业务账本。notificationUUID 去重，持久化后确认接收，异步应用并重试。
        退款/撤销按交易来源同步到各恢复安装，保留独立免费权益；防止乱序通知覆盖最新交易事实。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              additionalProperties: false
              properties:
                signedPayload: {type: string, minLength: 10, maxLength: 131072}
      responses:
        '200':
          description: 已验签并持久化，或已处理的合法重复通知
        '400': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/wallpapers/{wallpaperId}/ios-acquisition:
    get:
      tags: [iOS Test Administration]
      operationId: getAdminWallpaperIosAcquisition
      summary: 查询壁纸的 iOS 首免与内购配置
      security: [{adminCookie: []}]
      parameters:
        - in: path
          name: wallpaperId
          required: true
          schema: {$ref: '#/components/schemas/WallpaperId'}
      responses:
        '200':
          description: iOS 非消耗型商品映射与首免资格
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IosProductConfiguration'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [iOS Test Administration]
      operationId: updateAdminWallpaperIosAcquisition
      summary: 保存壁纸积分价和首免资格，兼容旧非消耗型映射
      security: [{adminCookie: [], adminCsrf: []}]
      parameters:
        - in: path
          name: wallpaperId
          required: true
          schema: {$ref: '#/components/schemas/WallpaperId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [firstFreeEligible, enabled]
              properties:
                productId: {type: string, nullable: true, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._-]+$'}
                acquisitionMode: {type: string, enum: [CREDITS, NON_CONSUMABLE], default: NON_CONSUMABLE}
                credits: {$ref: '#/components/schemas/IosWallpaperCredits'}
                chinaReferencePrice:
                  allOf: [{$ref: '#/components/schemas/IosChinaReferencePrice'}]
                  deprecated: true
                  description: 兼容旧管理后台的废弃字段；值始终忽略，价格只能从 App Store Connect 自动同步。
                firstFreeEligible: {type: boolean}
                enabled: {type: boolean}
      responses:
        '200':
          description: 映射已保存；验证过交易后 productId 不可更改
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IosProductConfiguration'}
