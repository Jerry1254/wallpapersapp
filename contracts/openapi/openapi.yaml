        no-store。仅返回已启用且当前平台支持的本机检测项。关闭规则不解除历史封禁。设备注册、挑战、会话仅用于恢复身份，不绕过黑名单。
  /device/security/reports:
    post:
      tags:
        - Device Security
      operationId: reportDeviceSecuritySignals
      summary: 提交已启用的本机环境信号
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/RequestTimestamp"
        - $ref: "#/components/parameters/RequestNonce"
        - $ref: "#/components/parameters/RequestSignature"
      responses:
        "200":
          description: 服务器当前状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityReport"
      description: 必须使用安装凭据正文签名；本机信号不等于硬件远程认证。UNKNOWN、不支持的平台及已关闭规则不触发封禁。命中规则永久封禁设备及当前可信来源
        IP，只能管理员解除。
  /device/security/harmony/challenges:
    post:
      tags:
        - Device Security
      operationId: createHarmonyRiskChallenge
      summary: 申请鸿蒙 SafetyDetect 单次检测挑战
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/RequestTimestamp"
        - $ref: "#/components/parameters/RequestNonce"
        - $ref: "#/components/parameters/RequestSignature"
      responses:
        "200":
          description: 服务器当前状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonyRiskChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      description: 仅鸿蒙安装凭据可调用，必须正文签名。规则关闭、已封禁或适配器关闭时不发放 nonce。nonce 为服务器随机 32 字节 Base64，绑定设备和当时请求的检测项，120 秒有效且只能使用一次；每设备至少间隔 60 秒、每天最多发放 20 次。正常检查间隔建议 90 分钟，额度耗尽不封禁。
  /device/security/harmony/reports:
    post:
      tags:
        - Device Security
      operationId: reportHarmonyRiskProof
      summary: 提交华为签名的鸿蒙风险凭证
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/RequestTimestamp"
        - $ref: "#/components/parameters/RequestNonce"
        - $ref: "#/components/parameters/RequestSignature"
      responses:
        "200":
          description: 服务器当前状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarmonyRiskProof"
      description: 仅鸿蒙安装凭据可调用，必须正文签名。服务器校验 ES256、三层证书链和固定可信华为根、叶证书名称、App ID、nonce 与时间戳；原子消费 nonce 防止跨设备提交及重放。仅已请求且当前仍启用的成功风险因子才能永久封禁设备和当前可信来源 IP。失败或 UNKNOWN 不封禁；旧的普通 signals 路由不能触发鸿蒙封禁。
