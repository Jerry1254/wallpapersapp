      description: |
        deliveryMode=LIVE_PHOTO 时 ticket、expiresAt、resourceVersion 和 sourceVideo 必须存在，photo/video 应为 null 或省略。
        deliveryMode=LIVE_PHOTO 的 sourceVideo 只能在免费商品或当前设备具有有效权益时签发。
      required: [deliveryMode, wallpaperId, cover]
      properties:
        deliveryMode:
          type: string
          enum: [SECURE_PACKAGE, MOVING_PHOTO, LIVE_PHOTO, STATIC_IMAGE]
        wallpaperId:
          $ref: '#/components/schemas/LongId'
        cover:
          $ref: '#/components/schemas/PublicMedia'
        ticket:
          type: string
          minLength: 32
          maxLength: 2048
          nullable: true
          readOnly: true
          description: 90 秒有效的受控下载票据。
        downloadUrl:
          type: string
          format: uri-reference
          nullable: true
          description: 不含票据的受控下载地址；客户端通过 Authorization Bearer 提交 ticket。
        expiresAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        resourceVersion:
          type: object
          allOf:
            - $ref: '#/components/schemas/DownloadResourceVersion'
          nullable: true
        package:
          type: object
          allOf:
            - $ref: '#/components/schemas/SecurePackageMetadata'
          nullable: true
        poster:
          type: object
          allOf:
            - $ref: '#/components/schemas/DeliveryFile'
          nullable: true
          description: MOVING_PHOTO 的 JPEG 首帧；不构成通用静态壁纸能力。
