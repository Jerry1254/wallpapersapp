openapi: 3.0.3
info:
  title: 倾境壁纸 API
  version: 1.6.0
  license:
    name: Proprietary
    url: https://github.com/Jerry1254/wallpapersapp
  description: |
    倾境壁纸 H5、正式 App 与管理后台共用的 V1 契约。

    所有 Long ID 在 JSON 中使用字符串；所有时间均为带时区的 ISO 8601 字符串。
    公开目录仅返回封面和能力描述，不返回存储键、绝对路径、内容密钥或正式资源永久地址。
servers:
  - url: /api/v1
    description: 当前来源下的 V1 API；本地联调默认由开发代理转发到 API Server
security: []
tags:
  - name: Public Catalog
    description: 无需设备会话的公开目录与封面读取
  - name: Public Tutorial
    description: 无需设备会话的壁纸设置教程与视频流
  - name: Device Identity
    description: 匿名设备注册、挑战和短期会话
  - name: Device Entitlement
    description: 兑换、权益与下载描述
  - name: Admin Session
    description: 单管理员会话
  - name: Admin Asset
    description: 受控文件上传与元数据查询
  - name: Admin Catalog
    description: 分类、壁纸、平台变体与资源版本
  - name: Admin Tutorial
    description: 五个固定壁纸设置教程槽位的视频、启停与排序
  - name: Admin Redemption
    description: 兑换码批次、兑换事件、设备与权益查询

paths:
  /public/categories:
    get:
      tags: [Public Catalog]
      operationId: listPublicCategories
      summary: 查询公开两级分类树
      responses:
        '200':
          description: 已发布内容对应的分类树
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicRootCategory'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/wallpapers:
    get:
      tags: [Public Catalog]
      operationId: listPublicWallpapers
      summary: 查询、筛选或搜索已发布壁纸
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: rootCategoryId
          in: query
          schema:
            $ref: '#/components/schemas/LongId'
        - name: childCategoryId
          in: query
          description: 提供时必须属于 rootCategoryId；未提供 rootCategoryId 时请求无效。
          schema:
            $ref: '#/components/schemas/LongId'
        - name: view
          in: query
          description: 系统视图。FEATURED 由 featuredRank 计算；STATIC 由已发布静态变体计算。
          schema:
            type: string
            enum: [FEATURED, STATIC]
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/WallpaperKind'
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/DeliveryPlatform'
        - name: q
          in: query
          description: 壁纸标题或受控关键词；去除首尾空格后长度为 1 至 40。
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: sort
          in: query
          schema:
            type: string
            enum: [DEFAULT, NEWEST]
            default: DEFAULT
      responses:
        '200':
          description: 壁纸分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWallpaperPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/wallpapers/{wallpaperId}:
    get:
      tags: [Public Catalog]
      operationId: getPublicWallpaper
      summary: 查询已发布壁纸详情
      parameters:
        - $ref: '#/components/parameters/WallpaperId'
        - name: platform
          in: query
          description: 提供后服务端优先返回该平台的能力描述。
          schema:
            $ref: '#/components/schemas/DeliveryPlatform'
      responses:
        '200':
          description: 壁纸详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWallpaperDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/assets/{assetId}/content:
    get:
      tags: [Public Catalog]
      operationId: readPublicAssetContent
      summary: 读取允许公开展示的分类图标或壁纸封面
      description: 仅 Asset 被已发布目录投影引用且角色允许公开展示时返回文件字节。
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 文件内容
          headers:
            ETag:
              description: 文件内容摘要对应的缓存标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/wallpaper-tutorials:
    get:
      tags: [Public Tutorial]
      operationId: listPublicWallpaperTutorials
      summary: 查询已启用的壁纸设置教程
      description: 仅返回已启用且视频资产已就绪的固定教程槽位，按 sortOrder 排序。
      responses:
        '200':
          description: 可用教程列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicWallpaperTutorial'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/wallpaper-tutorials/{tutorialKey}/video:
    get:
      tags: [Public Tutorial]
      operationId: streamPublicWallpaperTutorialVideo
      summary: 读取教程 MP4 视频流
      description: 支持单段 bytes Range；请求与响应字节边界必须精确。v 用于版本化缓存地址；仅当前版本可长缓存，缺失或旧版本返回当前内容并要求缓存重新验证。
      parameters:
        - $ref: '#/components/parameters/TutorialKey'
        - name: v
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Range
          in: header
          description: 单段 bytes 范围，例如 bytes=0-1023。
          schema:
            type: string
        - name: If-Range
          in: header
          description: 仅匹配当前强 ETag 时返回分段；不匹配时返回完整内容。
          schema: { type: string }
      responses:
        '200':
          description: 完整 MP4 内容
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Length:
              schema: { type: integer, format: int64 }
            ETag:
              schema: { type: string }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '206':
          description: 指定字节范围的 MP4 内容
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Length:
              schema: { type: integer, format: int64 }
            Content-Range:
              schema: { type: string }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Range 无法满足
          headers:
            Content-Range:
              schema: { type: string }
              description: 当前资源长度，例如 bytes */1024。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags: [Public Tutorial]
      operationId: inspectPublicWallpaperTutorialVideo
      summary: 查询教程 MP4 的字节与缓存元数据
      description: HEAD 忽略 Range 并返回完整内容长度，不返回响应体。
      parameters:
        - $ref: '#/components/parameters/TutorialKey'
        - name: v
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: 完整内容元数据
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Length:
              schema: { type: integer, format: int64 }
            ETag:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/registrations:
    post:
      tags: [Device Identity]
      operationId: registerDevice
      summary: 注册或重新关联匿名设备凭据
      description: |
        正式 App 提交平台公钥和设备证明；H5 联调只允许在启用测试 Provider 的环境提交 H5_TEST_SECRET。
        返回的 H5 测试 secret 只出现一次，服务端不保存其明文。
        Android 1.1.0 使用 SEC-002 安装级 RSA 2048 持钥证明；同公钥新证明恢复原 ACTIVE 凭据，撤销后不可重建。
        证明不等同硬件或 APK 来源认证，清数据/卸载后不自动恢复旧权益。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
      responses:
        '201':
          description: 新凭据已创建或已有设备已关联
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/session-challenges:
    post:
      tags: [Device Identity]
      operationId: createDeviceSessionChallenge
      summary: 申请一次性设备会话挑战
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialKeyId]
              properties:
                credentialKeyId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: 挑战已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSessionChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/sessions:
    post:
      tags: [Device Identity]
      operationId: createDeviceSession
      summary: 使用挑战证明换取短期设备会话
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceSessionRequest'
      responses:
        '201':
          description: 设备会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/encryption-key:
    put:
      tags: [Device Identity]
      operationId: bindDeviceEncryptionKey
      summary: 以当前安装签名身份固定绑定独立解密公钥
      description: Android RSA-2048 解密公钥；签署精确正文。同公钥重复绑定幂等，不允许替换已绑定公钥。保留原
        credentialKeyId 和权益。
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/RequestSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindEncryptionKeyRequest'
      responses:
        '200':
          description: 已绑定公钥摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionKeyBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/me/entitlements:
    get:
      tags: [Device Entitlement]
      operationId: listMyEntitlements
      summary: 查询当前设备已获得的壁纸
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前设备有效权益分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/redemptions:
    post:
      tags: [Device Entitlement]
      operationId: redeemWallpaper
      summary: 使用兑换码为当前设备获得壁纸
      description: |
        Idempotency-Key 在同一设备内唯一。相同键与相同请求体返回原最终结果；相同键异参返回 409。
        只有 GRANTED 消耗一次额度；ALREADY_OWNED 的 quotaDelta 为 0。
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/RequestSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemWallpaperRequest'
      responses:
        '200':
          description: 已存在的幂等结果，或设备原本已拥有壁纸
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResult'
        '201':
          description: 新权益已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResult'
        '202':
          description: 请求仍在处理中；客户端保留原 key 并查询确认
          content:
            application/json:
              schema:
                type: object
                required: [status, idempotencyKey]
                properties:
                  status:
                    type: string
                    enum: [PROCESSING]
                  idempotencyKey:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 兑换结果为业务拒绝；响应体仍保存为该幂等请求的最终结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResult'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/redemptions/{idempotencyKey}:
    get:
      tags: [Device Entitlement]
      operationId: getRedemptionResult
      summary: 按幂等键确认兑换最终结果
      security:
        - deviceBearer: []
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已有最终结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResult'
        '202':
          description: 请求仍在恢复或处理中
          content:
            application/json:
              schema:
                type: object
                required: [status, idempotencyKey]
                properties:
                  status:
                    type: string
                    enum: [PROCESSING]
                  idempotencyKey:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/wallpapers/{wallpaperId}/download-tickets:
    post:
      tags: [Device Entitlement]
      operationId: createDownloadTicket
      summary: 为已获得壁纸签发短时下载描述
      description: |
        H5_TEST 设备返回 H5_PLACEHOLDER 描述；正式 App 可返回 SECURE_PACKAGE 描述。
        二者复用相同端点和稳定字段，客户端按 deliveryMode 选择实现。
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/WallpaperId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/RequestSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDownloadTicketRequest'
      responses:
        '201':
          description: 下载描述已签发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadDescriptor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery/files:
    get:
      tags: [Device Entitlement]
      operationId: downloadProtectedFile
      summary: 使用短时票据读取受保护交付文件
      description: Authorization Bearer ticket 是 60 至 120 秒有效、限定设备和资源版本的不可猜测字符串。
      security:
        - downloadTicketBearer: []
      responses:
        '200':
          description: 加密资源包字节
          headers:
            Digest:
              description: '密文摘要，例如 sha-256=:base64:'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 票据已过期或已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/sessions:
    post:
      tags: [Admin Session]
      operationId: createAdminSession
      summary: 管理员登录
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '201':
          description: 会话已创建；session cookie 由 Set-Cookie 返回
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Admin Session]
      operationId: getAdminSession
      summary: 查询当前管理员会话
      security:
        - adminCookie: []
      responses:
        '200':
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin Session]
      operationId: deleteAdminSession
      summary: 退出当前管理员会话
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: 会话已撤销
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/dashboard:
    get:
      tags: [Admin Redemption]
      operationId: getAdminDashboard
      summary: 查询管理首页汇总数据
      security:
        - adminCookie: []
      responses:
        '200':
          description: 从业务事实实时或通过可丢失缓存计算的汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/assets:
    post:
      tags: [Admin Asset]
      operationId: uploadAdminAsset
      summary: 上传并校验一个资源文件
      description: 文件先写入隔离暂存区；校验通过后原子移入正式相对存储键。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose:
                  $ref: '#/components/schemas/AssetPurpose'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 文件元数据；VALIDATING 表示异步校验尚未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 上传超过该用途允许的大小
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: 文件类型不受支持或探测类型与声明不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/parallax-packages:
    post:
      tags: [Admin Asset]
      operationId: importAdminParallaxPackage
      summary: 导入固定格式 4D ZIP 源包
      description: 同步校验根目录 cover.jpg、config.json、连续编号的 2～12 层图片，并原样保存 v2 配置。ZIP 最大 100 MiB、解压总量 85 MiB、64 条目、图层与配置 64 MiB。相同 SHA-256 的可用源包复用；不返回原始 ZIP 地址。详见 API-007/API-008。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 新源包及派生资产已校验并原子保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParallaxSourcePackage'
        '200':
          description: 复用相同 SHA-256 的可用源包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParallaxSourcePackage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: ZIP、单文件、条目解压总量或内部资源负载超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: ZIP 或图片真实类型不支持或与后缀不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/variants/{variantId}/parallax-resource-versions:
    post:
      tags: [Admin Catalog]
      operationId: createAdminParallaxResourceVersion
      summary: 用已导入源包创建 Android 4D 资源版本
      description: 仅可编辑 Android LAYER_PARALLAX 变体。事务保存版本、绑定和源包关联；相同变体、版本号和源包重试返回既有版本，版本号被其他源包占用返回 409。旧版资源的 sourcePackage 显式为 null。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParallaxResourceVersionRequest'
      responses:
        '201':
          description: 新 READY 版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResourceVersion'
        '200':
          description: 相同请求对应的既有版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResourceVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

