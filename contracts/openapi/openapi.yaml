    put:
      tags: [Admin App Releases]
      operationId: updateAppReleasePolicy
      summary: 修改说明、商店地址和强制开关
      description: 关闭forceUpdate后该版本转为普通更新，其他发布版本的强制门槛继续生效。版本身份和APK不可变；弃用版本不可编辑。
      security: [{adminCookie: [], adminCsrf: []}]
      parameters:
        - name: releaseId
          in: path
