components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-session
      description: Redis 中可撤销、可过期的短期设备会话。
    downloadTicketBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-download-ticket
      description: 只允许读取一个资源版本的短时票据；放在 Authorization header，避免进入 URL 日志。
    adminCookie:
      type: apiKey
      in: cookie
      name: QJ_ADMIN_SESSION
      description: HttpOnly、Secure、SameSite Cookie。
    adminCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 管理端写操作必须与会话绑定的 CSRF token 一致。
    adminDeliveryTicket:
      type: apiKey
      in: header
      name: X-Delivery-Ticket
      description: 只允许读取一次性交付 CSV 的短时票据，确认交付或过期后失效。
    previewTicketBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-preview-ticket
      description: 独立 90 秒预览票据，仅允许读取受限预览包；放在 Authorization header，禁止 URL 携带。

    supportMediaTicket:
      type: apiKey
      in: query
      name: ticket
      description: 仅允许读取一个客服媒体文件的15分钟凭据，原生播放器不能携带设备正文签名

  headers:
    EntityTag:
      description: 当前聚合 lockVersion 的强 ETag，例如 "7"。
      schema:
        type: string
        pattern: '^"[0-9]+"$'

  parameters:
    LegalDocumentKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        enum: [privacy, terms]
    AppVersionName:
      name: X-App-Version-Name
      in: header
      description: 实际安装包营销版本；有生效强制规则时缺失/无效按旧客户端处理。兼容门禁不等于防伪硬件证明。
      schema: {type: string, maxLength: 64}
    AppVersionCode:
      name: X-App-Version-Code
      in: header
      description: 实际安装包build/versionCode；平台从已认证会话读取，不能由header切换。
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    AppAbi:
      name: X-App-ABI
      in: header
      schema: {type: string, enum: [arm64-v8a, armeabi-v7a, x86, x86_64]}
    AppAndroidSdk:
      name: X-App-Android-Sdk
      in: header
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WallpaperId:
      name: wallpaperId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    TutorialKey:
      name: tutorialKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WallpaperTutorialKey'
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    ResourceVersionId:
      name: resourceVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    RedemptionId:
      name: redemptionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    RequestId:
      name: X-Request-Id
      in: header
      description: 可选链路请求 UUID；缺省时由服务端生成并在错误响应返回。
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 一次用户写入意图对应的 UUID；超时重试必须复用。
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 上次读取到的强 ETag，用于阻止覆盖并发修改。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    RequestTimestamp:
      name: X-Request-Timestamp
      in: header
      required: true
      description: 签名覆盖的 UTC 时间，服务端限制允许偏差。
      schema:
        type: string
        format: date-time
    RequestNonce:
      name: X-Request-Nonce
      in: header
      required: true
      description: 本次敏感请求的随机 UUID，短时内不得复用。
      schema:
        type: string
        format: uuid
    RequestSignature:
      name: X-Request-Signature
      in: header
      required: true
      description: 客户端凭据对方法、路径、时间、nonce 和请求体摘要生成的 Base64URL 证明。
      schema:
        type: string
        minLength: 16
        maxLength: 1024

    ResetId:
      in: path
      name: resetId
      required: true
      schema: {type: string, format: uuid}
    AppAttestKey:
      in: header
      name: X-App-Attest-Key-Id
      required: true
      schema: {type: string, maxLength: 256}
    AppAttestAssertion:
      in: header
      name: X-App-Attest-Assertion
      required: true
      description: Base64 的 App Attest assertion，覆盖本请求原始 UTF-8 字节的 SHA256
      schema: {type: string, maxLength: 32768}

  responses:
    AppReleaseResult:
      description: 新增或更新后的版本记录（data外层）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AppReleaseEnvelope'}
    AppUpdateRequired:
      description: 当前会话平台版本低于有效强制门槛；客户端重新检查并展示不可关闭弹窗。支付验签/恢复不被该门槛阻断。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    BadRequest:
      description: 请求格式、参数或字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 会话或身份凭据缺失、无效或已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已识别身份无权执行操作，或请求证明/CSRF 校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在或当前调用方不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 唯一键、状态、引用关系或幂等键与请求内容冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: If-Match 与当前 lockVersion 不一致
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: 请求格式正确但不满足领域或安全校验规则
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 超过设备、IP、账号、码摘要或下载频率限制
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreviewUnavailable:
      description: 当前预览未就绪；503 PREVIEW_PROCESSING 表示等待或处理中，PREVIEW_GENERATION_FAILED 表示失败，不返回干净源或旧代次预览。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 未预期服务错误；不返回堆栈、秘密或内部路径
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ResetResult:
      description: 指定重置操作的当前状态，不包含设备凭证或购买数据
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ResetOperation'}
    ResetPending:
      description: 操作已接受但未完成；客户端退避刷新，不重新创建重置或提前显示免费可用
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ResetOperation'}
    Error:
      description: 确定的拒绝或可重试错误；未知状态不得发放权益，响应中不得泄露密钥或原始文件
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}

  schemas:
    SecurityEvent:
      type: object
      required:
        - id
        - action
        - result
        - changes
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/LongId"
        action:
          type: string
        actor:
          type: string
        result:
          type: string
          enum:
            - SUCCEEDED
            - FAILED
        changes:
          type: string
          description: 后台审计变更摘要的 JSON 文本，不含凭据
        createdAt:
          type: string
          format: date-time

    SecurityRule:
      type: object
      description: available 表示存在可接入的平台检测，不保证所有该平台设备均公开系统状态。DEVELOPER_MODE、USB_DEBUGGING 当前仅支持 ANDROID；隐藏状态或读取失败按 UNKNOWN 处理，不封禁。
      required:
        - key
        - title
        - description
        - enabled
        - available
        - platforms
        - threshold
        - windowSeconds
        - version
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        enabled: &a1
          type: boolean
        available: *a1
        platforms:
          type: array
          items:
            type: string
        threshold:
          type: integer
          minimum: 1
          maximum: 100000
        windowSeconds:
          type: integer
          minimum: 10
          maximum: 86400
        version:
          type: integer
          format: int64
          minimum: 0
    SecurityPolicy:
      type: object
      required:
        - enabled
        - version
        - rules
      properties:
        enabled: *a1
        version:
          type: integer
          format: int64
          minimum: 0
        rules:
          type: array
          items:
            $ref: "#/components/schemas/SecurityRule"
    SecurityState:
      type: object
      required:
        - allowed
        - checks
      properties:
        allowed: *a1
        checks:
          type: array
          items:
            type: string
            enum:
              - DEVELOPER_MODE
              - USB_DEBUGGING
              - ROOT_JAILBREAK
              - EMULATOR
    HarmonyRiskChallenge:
      type: object
      required: [allowed, checks, nonce, retryAfterSeconds]
      properties:
        allowed:
          type: boolean
        checks:
          type: array
          maxItems: 2
          items:
            type: string
            enum: [DEVELOPER_MODE, USB_DEBUGGING]
        nonce:
          type: string
          nullable: true
          description: 32 字节随机数的 Base64，未发放挑战时为 null
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: 距建议下次申请的秒数，额度不足时不调用华为服务
    HarmonyRiskProof:
      type: object
      required: [nonce, jws]
      properties:
        nonce:
          type: string
          pattern: '^[A-Za-z0-9+/]{43}=$'
        jws:
          type: string
          minLength: 1
          maxLength: 32768
          description: 原封不动的华为 SafetyDetect JWS，服务器验证后才能使用
    SecurityReport:
      type: object
      description: 仅上报服务器请求的环境检测。安卓开发者模式或 USB／无线调试只有明确读取到对应系统值 1 时报告 RISK；系统值 0 可能被隐藏，缺失、隐藏或读取失败均报告 UNKNOWN。禁用规则、非适配平台和 UNKNOWN 不触发封禁。鸿蒙不信任此路由的客户端 signals，必须提交华为签名凭证。
      required:
        - signals
      properties:
        signals:
          type: object
          maxProperties: 4
          additionalProperties:
            type: string
            enum:
              - NORMAL
              - RISK
              - UNKNOWN
    SecurityPolicyUpdate:
      type: object
      required:
        - enabled
        - version
      properties:
        enabled: *a1
        version:
          type: integer
          format: int64
          minimum: 0
    SecurityRuleUpdate:
      type: object
      required:
        - enabled
        - threshold
        - windowSeconds
        - version
      properties:
        enabled: *a1
        threshold:
          type: integer
          minimum: 1
          maximum: 100000
        windowSeconds:
          type: integer
          minimum: 10
          maximum: 86400
        version:
          type: integer
          format: int64
          minimum: 0
    SecurityBanRequest:
      type: object
      required:
        - reason
      properties:
        deviceId: &a2
          $ref: "#/components/schemas/LongId"
        ip:
          type: string
          maxLength: 45
        reason:
          type: string
          minLength: 1
          maxLength: 300
    SecurityReleaseRequest:
      type: object
      required:
        - version
        - includeRelated
        - reason
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        includeRelated: *a1
        reason:
          type: string
          minLength: 1
          maxLength: 300
    SecurityBan:
      type: object
      required:
        - id
        - groupId
        - subjectType
        - subjectValue
        - ruleKey
        - reason
        - bannedAt
        - version
      properties:
        id: *a2
        groupId:
          type: string
          format: uuid
        subjectType:
          type: string
          enum:
            - DEVICE
            - IP
        subjectValue:
          type: string
        deviceId: *a2
        platform:
          type: string
        ip:
          type: string
        ruleKey:
          type: string
        reason:
          type: string
        bannedAt: &a3
          type: string
          format: date-time
        bannedBy:
          type: string
        releasedAt: *a3
        releasedBy:
          type: string
        releaseReason:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
    SecurityBanPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityBan"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
    SecurityWhitelistRequest:
      type: object
      required:
        - subjectType
        - subjectValue
        - note
      properties:
        subjectType:
          type: string
          enum:
            - DEVICE
            - IP
        subjectValue:
          type: string
          minLength: 1
          maxLength: 64
        note:
          type: string
          minLength: 1
          maxLength: 300
    SecurityWhitelist:
      type: object
      required:
        - id
        - subjectType
        - subjectValue
        - note
        - createdAt
      properties:
        id: *a2
        subjectType:
          type: string
          enum:
            - DEVICE
            - IP
        subjectValue:
          type: string
        note:
          type: string
        createdAt: *a3

