        video:
          type: object
          allOf:
            - $ref: '#/components/schemas/DeliveryFile'
          nullable: true
          description: MOVING_PHOTO 的正式 MP4；LIVE_PHOTO 正式下载不再使用此字段。
        sourceVideo:
          type: object
          allOf:
            - $ref: '#/components/schemas/DeliveryFile'
          nullable: true
          description: LIVE_PHOTO 的原始 MP4；仅在正式兑换或已有权益后通过短时票据下发。
