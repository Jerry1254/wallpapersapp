    ResourceVersionStatus:
      type: string
      enum: [DRAFT, VALIDATING, READY, PUBLISHED, RETIRED, REJECTED]

    CreateResourceVersionRequest:
      type: object
      required: [versionNo, bindings]
      properties:
        versionNo:
          type: integer
          minimum: 1
          maximum: 2147483647
        manifestSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          nullable: true
        bindings:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreateResourceBindingRequest'

    CreateResourceBindingRequest:
      type: object
      required: [assetId, role, ordinal]
      properties:
        assetId:
          $ref: '#/components/schemas/LongId'
        role:
          $ref: '#/components/schemas/AssetRole'
        ordinal:
          type: integer
          minimum: 0
          maximum: 32767

    AdminResourceVersion:
      type: object
      required: [id, versionNo, status, bindings, sourcePackage, createdAt, version]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ResourceVersionStatus'
        manifestSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          nullable: true
        validationErrors:
          type: array
          maxItems: 100
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                maxLength: 64
              message:
                type: string
                maxLength: 300
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/AdminResourceBinding'
        sourcePackage:
          type: object
          allOf:
            - $ref: '#/components/schemas/AdminParallaxSourcePackage'
          nullable: true
          description: ZIP 导入来源；旧版手工创建资源显式返回 null。
        publishedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        retiredAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          format: int64
          minimum: 0

    AdminParallaxSourcePackage:
      type: object
      required: [id, originalFilename, mimeType, sizeBytes, sha256, validationStatus, cover, configFormatVersion, canvas, layers]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          enum: [application/zip]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        validationStatus:
          type: string
          enum: [READY]
        cover:
          $ref: '#/components/schemas/AdminAsset'
        configFormatVersion:
          type: integer
          enum: [2]
          description: 模拟器原始 config.json 的格式版本；当前正式发布仅允许 v2。
        canvas:
          type: object
          required: [width, height]
          properties:
            width:
              type: integer
              minimum: 512
              maximum: 4096
            height:
              type: integer
              minimum: 512
              maximum: 4096
        layers:
          type: array
          minItems: 2
          maxItems: 12
          description: 源包 01 到 N 的前到后顺序；API 只映射包内文件角色，不转换 config.json。
          items:
            $ref: '#/components/schemas/AdminParallaxSourceLayer'

    AdminParallaxSourceLayer:
      type: object
      required: [index, originalFilename, role, ordinal]
      properties:
        index:
          type: integer
          minimum: 1
          maximum: 12
        originalFilename:
          type: string
          pattern: '^layers/(0[1-9]|1[0-2])\.(png|jpg|webp)$'
        role:
          type: string
          enum: [FOREGROUND, BACKGROUND]
        ordinal:
          type: integer
          minimum: 0
          maximum: 10

