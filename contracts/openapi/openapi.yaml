  /delivery/live-photo/video:
    get:
      deprecated: true
      tags: [Device Entitlement]
      operationId: downloadLegacyLivePhotoVideo
      summary: 使用 iOS 短时票据下载旧版标准化 MOV
      description: 仅用于旧客户端过渡；OpenAPI 2.13.0 起的 iOS 客户端使用 sourceVideo。
      security:
        - downloadTicketBearer: []
      responses:
        '200':
