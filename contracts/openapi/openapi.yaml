          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantWriteRequest'
      responses:
        '200':
          description: 变体已更新
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWallpaperVariant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin Catalog]
      operationId: deleteAdminWallpaperVariant
      summary: 删除从未发布且没有历史引用的平台变体
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: 变体已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/variants/{variantId}/resource-versions:
    post:
      tags: [Admin Catalog]
      operationId: createAdminResourceVersion
      summary: 使用已上传 Asset 创建不可变候选资源版本
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceVersionRequest'
      responses:
        '201':
          description: 候选资源版本已创建并进入校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResourceVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/resource-versions/{resourceVersionId}/secure-package:
    post:
      tags: [Admin Catalog]
      operationId: buildAdminSecurePackage
      summary: 为 Android 兼容资源版本制作正式包与受限试用包
      description: 校验媒体后为 READY 版本事务内制作 format 2 正式包和 format 3 APP_PREVIEW 受限包，失败回滚并清理本次对象。两包都存在时幂等返回；已有正式包的 PUBLISHED 版本允许补建受限包，正式包和正式 manifest 不变。已发布且无正式包的版本仍需创建下一版本。缺少资源签名或媒体工具配置时不可制作。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/ResourceVersionId'
      responses:
        '200':
          description: 已制作版本与真实 manifest 摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResourceVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/resource-versions/{resourceVersionId}:
    get:
      tags: [Admin Catalog]
      operationId: getAdminResourceVersion
      summary: 查询资源版本、绑定与校验结果
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceVersionId'
      responses:
        '200':
          description: 资源版本详情
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResourceVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/code-batches:
    get:
      tags: [Admin Redemption]
      operationId: listAdminCodeBatches
      summary: 查询兑换码批次和汇总额度
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: 按批次号或批次名查询
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: 批次分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeBatchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin Redemption]
      operationId: createAdminCodeBatch
      summary: 原子生成兑换码批次和一次性交付票据
      description: 同一 Idempotency-Key 重试返回同一批次，不重复生成兑换码。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCodeBatchRequest'
      responses:
        '201':
          description: 批次和短时一次性交付票据已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCodeBatchResponse'
        '200':
          description: 返回同一幂等请求已经创建的批次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCodeBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/code-batches/{batchId}:
    get:
      tags: [Admin Redemption]
      operationId: getAdminCodeBatch
      summary: 查询批次详情
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: 批次详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCodeBatchDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/code-batches/{batchId}/codes:
    get:
      tags: [Admin Redemption]
      operationId: listAdminRedemptionCodes
      summary: 查询批次内兑换码掩码和额度
      description: 永远不返回完整兑换码或可恢复的码材料。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RedemptionCodeStatus'
        - name: suffix
          in: query
          schema:
            type: string
            minLength: 4
            maxLength: 8
            pattern: '^[A-Z0-9]+$'
      responses:
        '200':
          description: 掩码兑换码分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionCodePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/code-batches/{batchId}/delivery:
    get:
      tags: [Admin Redemption]
      operationId: downloadAdminCodeBatchDelivery
      summary: 使用一次性交付票据下载明文兑换码 CSV
      description: 票据只能在短时内使用；确认交付或过期后无法从数据库恢复明文。
      security:
        - adminCookie: []
          adminDeliveryTicket: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: UTF-8 CSV 文件
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 交付票据已过期、已确认或已销毁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/code-batches/{batchId}/delivery-confirmation:
    post:
      tags: [Admin Redemption]
      operationId: confirmAdminCodeBatchDelivery
      summary: 确认已保存交付文件并销毁明文材料
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: 已确认并销毁仍存在的明文交付材料
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/redemptions:
    get:
      tags: [Admin Redemption]
      operationId: listAdminRedemptions
      summary: 查询不可变兑换事件
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: codeSuffix
          in: query
          schema:
            type: string
            minLength: 4
            maxLength: 8
            pattern: '^[A-Z0-9]+$'
        - name: wallpaperId
          in: query
          schema:
            $ref: '#/components/schemas/LongId'
        - name: deviceId
          in: query
          description: 仅管理端使用的内部字符串 ID
          schema:
            $ref: '#/components/schemas/LongId'
        - name: result
          in: query
          schema:
            $ref: '#/components/schemas/RedemptionResultCode'
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 兑换事件分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRedemptionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/redemptions/{redemptionId}:
    get:
      tags: [Admin Redemption]
      operationId: getAdminRedemption
      summary: 查询兑换事件及关联权益详情
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      responses:
        '200':
          description: 兑换事件详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRedemptionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/devices:
    get:
      tags: [Admin Redemption]
      operationId: listAdminDevices
      summary: 查询匿名设备内部视图
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/DevicePlatform'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, REVIEW, DISABLED]
      responses:
        '200':
          description: 设备分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDevicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/devices/{deviceId}:
    get:
      tags: [Admin Redemption]
      operationId: getAdminDevice
      summary: 查询设备、凭据摘要和权益事实
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备详情；不返回原始证据、secret、公钥私密材料或会话令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeviceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /device/wallpapers/{wallpaperId}/preview-tickets:
    post:
      tags:
        - Device Entitlement
      operationId: createPreviewTicket
      summary: 为 Android App 签发独立受限效果试用描述
      description: 需 Android 设备会话与持钥签名，无需权益，不扣兑换额度。仅交付降低规格且标记的试用素材；票据有效 90 秒仅用于下载，App
        实际预览由单调时钟限制为 120 秒，后台时间继续计入。正式下载与试用票据、包格式和临时库相互隔离。
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/WallpaperId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestTimestamp"
        - $ref: "#/components/parameters/RequestNonce"
        - $ref: "#/components/parameters/RequestSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePreviewTicketRequest"
      responses:
        "201":
          description: 独立试用描述已签发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewDescriptor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /preview/files:
    get:
      tags:
        - Device Entitlement
      operationId: downloadPreviewFile
      summary: 使用独立试用票据读取受限预览包
      description: 只接受 previewTicketBearer；正式 downloadTicketBearer
        被拒绝。认证来自短时票据及活跃安装凭据，不产生权益。
      security:
        - previewTicketBearer: []
      responses:
        "200":
          description: QJPV0001 / format 3、purpose=APP_PREVIEW 的加密受限素材
          headers:
            Digest:
              description: "密文摘要，例如 sha-256=:base64:"
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: 票据已过期或已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-session
      description: Redis 中可撤销、可过期的短期设备会话。
    downloadTicketBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-download-ticket
      description: 只允许读取一个资源版本的短时票据；放在 Authorization header，避免进入 URL 日志。
    adminCookie:
      type: apiKey
      in: cookie
      name: QJ_ADMIN_SESSION
      description: HttpOnly、Secure、SameSite Cookie。
    adminCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 管理端写操作必须与会话绑定的 CSRF token 一致。
    adminDeliveryTicket:
      type: apiKey
      in: header
      name: X-Delivery-Ticket
      description: 只允许读取一次性交付 CSV 的短时票据，确认交付或过期后失效。
    previewTicketBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-preview-ticket
      description: 独立 90 秒预览票据，仅允许读取受限预览包；放在 Authorization header，禁止 URL 携带。

  headers:
    EntityTag:
      description: 当前聚合 lockVersion 的强 ETag，例如 "7"。
      schema:
        type: string
        pattern: '^"[0-9]+"$'

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WallpaperId:
      name: wallpaperId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    TutorialKey:
      name: tutorialKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WallpaperTutorialKey'
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    ResourceVersionId:
      name: resourceVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    RedemptionId:
      name: redemptionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    RequestId:
      name: X-Request-Id
      in: header
      description: 可选链路请求 UUID；缺省时由服务端生成并在错误响应返回。
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 一次用户写入意图对应的 UUID；超时重试必须复用。
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 上次读取到的强 ETag，用于阻止覆盖并发修改。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    RequestTimestamp:
      name: X-Request-Timestamp
      in: header
      required: true
      description: 签名覆盖的 UTC 时间，服务端限制允许偏差。
      schema:
        type: string
        format: date-time
    RequestNonce:
      name: X-Request-Nonce
      in: header
      required: true
      description: 本次敏感请求的随机 UUID，短时内不得复用。
      schema:
        type: string
        format: uuid
    RequestSignature:
      name: X-Request-Signature
      in: header
      required: true
      description: 客户端凭据对方法、路径、时间、nonce 和请求体摘要生成的 Base64URL 证明。
      schema:
        type: string
        minLength: 16
        maxLength: 1024

  responses:
    BadRequest:
      description: 请求格式、参数或字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 会话或身份凭据缺失、无效或已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已识别身份无权执行操作，或请求证明/CSRF 校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在或当前调用方不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 唯一键、状态、引用关系或幂等键与请求内容冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: If-Match 与当前 lockVersion 不一致
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: 请求格式正确但不满足领域或安全校验规则
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 超过设备、IP、账号、码摘要或下载频率限制
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 未预期服务错误；不返回堆栈、秘密或内部路径
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    LongId:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '42'
      description: Java Long ID 的 JSON 字符串表示。

    Timestamp:
      type: string
      format: date-time
      example: '2026-09-11T08:30:00Z'

    PageMetadata:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              maxLength: 500
            requestId:
              type: string
              format: uuid
            details:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [reason]
      properties:
        field:
          type: string
          maxLength: 128
        reason:
          type: string
          maxLength: 300

    ErrorCode:
      type: string
      description: V1 稳定错误码；message 可本地化，客户端分支只依赖 code。
      enum:
        - VALIDATION_FAILED
        - MALFORMED_REQUEST
        - UNAUTHORIZED
        - SESSION_EXPIRED
        - INVALID_DEVICE_PROOF
        - DEVICE_DISABLED
        - CSRF_INVALID
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - CATEGORY_NOT_FOUND
        - WALLPAPER_NOT_FOUND
        - ASSET_NOT_FOUND
        - CREDENTIAL_NOT_FOUND
        - REDEMPTION_REQUEST_NOT_FOUND
        - DUPLICATE_SLUG
        - DUPLICATE_CATEGORY_NAME
        - DUPLICATE_VARIANT
        - IDEMPOTENCY_KEY_REUSED
        - STATE_CONFLICT
        - RESOURCE_IN_USE
        - VERSION_CONFLICT
        - DOMAIN_RULE_VIOLATION
        - ASSET_NOT_READY
        - ASSET_VALIDATION_FAILED
        - RESOURCE_VERSION_NOT_READY
        - WALLPAPER_UNAVAILABLE
        - CODE_NOT_FOUND
        - CODE_EXHAUSTED
        - ENTITLEMENT_REQUIRED
        - DELIVERY_UNAVAILABLE
        - UNSUPPORTED_DEVICE
        - TICKET_EXPIRED
        - RATE_LIMITED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - CHALLENGE_INVALID
        - CODE_BATCH_NOT_FOUND
        - CODE_GENERATION_CONFLICT
        - CREDENTIAL_INVALID
        - CREDENTIAL_REVOKED
        - DELIVERY_EXPIRED
        - DELIVERY_TICKET_INVALID
        - DEVICE_NOT_FOUND
        - DEVICE_PROVIDER_NOT_ALLOWED
        - DEVICE_PROVIDER_UNAVAILABLE
        - DOWNLOAD_TICKET_INVALID
        - PLATFORM_MISMATCH
        - PROOF_INVALID
        - REDEMPTION_NOT_FOUND
        - REDEMPTION_PROCESSING
        - REQUEST_NONCE_REUSED
        - REQUEST_SIGNATURE_INVALID
        - SECURE_PACKAGE_NOT_READY
        - SIGNED_REQUEST_INVALID
        - TIMESTAMP_INVALID
        - PREVIEW_TICKET_INVALID
        - PREVIEW_RESOURCE_NOT_READY
        - TUTORIAL_NOT_FOUND
        - TUTORIAL_ASSET_IN_USE
        - TUTORIAL_VIDEO_REQUIRED
        - RANGE_NOT_SATISFIABLE
        - PARALLAX_PACKAGE_REQUIRED
        - PARALLAX_PACKAGE_INVALID
        - PARALLAX_PACKAGE_IN_USE

    WallpaperKind:
      type: string
      enum: [PARALLAX_4D, DYNAMIC, STATIC]

    WallpaperTutorialKey:
      type: string
      enum: [ANDROID_PARALLAX_4D, ANDROID_DYNAMIC, STATIC, HARMONYOS_DYNAMIC, IOS_DYNAMIC]

    WallpaperStatus:
      type: string
      enum: [DRAFT, PUBLISHED, OFFLINE, ARCHIVED]

    DeliveryPlatform:
      type: string
      enum: [ANDROID, IOS, HARMONYOS, UNIVERSAL]

    DevicePlatform:
      type: string
      enum: [ANDROID, IOS, HARMONYOS, H5_TEST]

    ResourceType:
      type: string
      enum: [LAYER_PARALLAX, VIDEO, LIVE_PHOTO, STATIC_IMAGE, THEME_PACKAGE]

    AssetRole:
      type: string
      enum:
        - COVER
        - BACKGROUND
        - FOREGROUND
        - PARALLAX_CONFIG
        - VIDEO
        - TUTORIAL_VIDEO
        - LIVE_PHOTO_IMAGE
        - LIVE_PHOTO_VIDEO
        - STATIC_IMAGE
        - THEME_PACKAGE

    AssetPurpose:
      type: string
      description: 决定允许的 MIME、大小、解码和压缩包安全校验规则。
      enum:
        - CATEGORY_ICON
        - WALLPAPER_COVER
        - BACKGROUND
        - FOREGROUND
        - PARALLAX_CONFIG
        - VIDEO
        - LIVE_PHOTO_IMAGE
        - LIVE_PHOTO_VIDEO
        - STATIC_IMAGE
        - THEME_PACKAGE

    CategorySummary:
      type: object
      required: [id, name, slug]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        name:
          type: string
          maxLength: 20
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 32

    PublicRootCategory:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          required: [icon, sortOrder, wallpaperCount, children]
          properties:
            icon:
              $ref: '#/components/schemas/PublicMedia'
            sortOrder:
              type: integer
              minimum: 0
              maximum: 999999
            wallpaperCount:
              type: integer
              format: int64
              minimum: 0
            children:
              type: array
              items:
                $ref: '#/components/schemas/PublicChildCategory'

    PublicChildCategory:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          required: [sortOrder, wallpaperCount]
          properties:
            sortOrder:
              type: integer
              minimum: 0
              maximum: 999999
            wallpaperCount:
              type: integer
              format: int64
              minimum: 0

    PublicMedia:
      type: object
      required: [assetId, contentUrl, mimeType]
      properties:
        assetId:
          $ref: '#/components/schemas/LongId'
        contentUrl:
          type: string
          format: uri-reference
          description: API 受控读取地址，不是 FileStorage 键或服务器文件路径。
        mimeType:
          type: string
          maxLength: 100
        widthPx:
          type: integer
          minimum: 1
          nullable: true
        heightPx:
          type: integer
          minimum: 1
          nullable: true

    DeliveryCapability:
      type: object
      required: [platform, resourceType]
      properties:
        platform:
          $ref: '#/components/schemas/DeliveryPlatform'
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        minimumOsVersion:
          type: string
          maxLength: 32
          nullable: true
        capabilityRequirements:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64

    PublicWallpaperSummary:
      type: object
      required:
        [
          id,
          title,
          slug,
          kind,
          rootCategory,
          cover,
          featured,
          sortOrder,
          capabilities
        ]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        title:
          type: string
          minLength: 1
          maxLength: 40
        slug:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        kind:
          $ref: '#/components/schemas/WallpaperKind'
        rootCategory:
          $ref: '#/components/schemas/CategorySummary'
        childCategory:
          type: object
          allOf:
            - $ref: '#/components/schemas/CategorySummary'
          nullable: true
        cover:
          $ref: '#/components/schemas/PublicMedia'
        featured:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 999999
        capabilities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DeliveryCapability'

    PublicWallpaperDetail:
      allOf:
        - $ref: '#/components/schemas/PublicWallpaperSummary'
        - type: object
          required: [copyrightNote, publishedAt]
          properties:
            copyrightNote:
              type: string
              minLength: 1
              maxLength: 500
            publishedAt:
              $ref: '#/components/schemas/Timestamp'

    PublicWallpaperPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicWallpaperSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'

    DeviceRegistrationRequest:
      type: object
      required: [platform, appInstallScope, credentialType, evidenceToken]
      properties:
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        appInstallScope:
          type: string
          minLength: 1
          maxLength: 64
          description: 应用签名、渠道或测试 Provider 的服务端允许值。
        credentialType:
          type: string
          enum: [PLATFORM_PUBLIC_KEY, H5_TEST_SECRET]
        publicKeyPem:
          type: string
          minLength: 64
          maxLength: 8192
          nullable: true
          description: PLATFORM_PUBLIC_KEY 必填；H5_TEST_SECRET 必须为空。
        evidenceToken:
          type: string
          minLength: 16
          maxLength: 8192
          writeOnly: true
          description: Android 为 Base64URL 无填充 JSON(timestamp, nonce, proof)，签名载荷见
            SEC-002；H5 为测试安装证据。服务端只保留身份 keyed hash，不持久化完整证明。

    DeviceRegistrationResponse:
      type: object
      required: [credentialKeyId, credentialType, createdAt]
      properties:
        credentialKeyId:
          type: string
          format: uuid
        credentialType:
          type: string
          enum: [PLATFORM_PUBLIC_KEY, H5_TEST_SECRET]
        credentialSecret:
          type: string
          minLength: 32
          maxLength: 512
          nullable: true
          readOnly: true
          description: 仅创建 H5_TEST_SECRET 时一次性返回。
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    DeviceSessionChallenge:
      type: object
      required: [challengeId, nonce, algorithm, expiresAt]
      properties:
        challengeId:
          type: string
          format: uuid
        nonce:
          type: string
          minLength: 32
          maxLength: 256
        algorithm:
          type: string
          enum: [ED25519, ECDSA_P256_SHA256, RSA_SHA256, HMAC_SHA256]
        expiresAt:
          $ref: '#/components/schemas/Timestamp'

    CreateDeviceSessionRequest:
      type: object
      required: [credentialKeyId, challengeId, clientTimestamp, proof]
      properties:
        credentialKeyId:
          type: string
          format: uuid
        challengeId:
          type: string
          format: uuid
        clientTimestamp:
          $ref: '#/components/schemas/Timestamp'
        proof:
          type: string
          minLength: 16
          maxLength: 2048
          writeOnly: true
          description: 对服务端规定的规范化挑战载荷生成的 Base64URL 签名或 HMAC。

    DeviceSession:
      type: object
      required: [accessToken, tokenType, expiresAt, platform]
      properties:
        accessToken:
          type: string
          minLength: 32
          maxLength: 2048
          readOnly: true
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        platform:
          $ref: '#/components/schemas/DevicePlatform'

    EntitlementSummary:
      type: object
      required: [id, wallpaper, grantedAt]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        wallpaper:
          $ref: '#/components/schemas/PublicWallpaperSummary'
        grantedAt:
          $ref: '#/components/schemas/Timestamp'

    EntitlementPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'

    RedeemWallpaperRequest:
      type: object
      required: [wallpaperId, code]
      properties:
        wallpaperId:
          $ref: '#/components/schemas/LongId'
        code:
          type: string
          minLength: 20
          maxLength: 32
          writeOnly: true
          description: 忽略空格和连字符并转大写后必须为 20 位系统字符；不得进入日志。

    RedemptionResultCode:
      type: string
      enum:
        - GRANTED
        - ALREADY_OWNED
        - CODE_NOT_FOUND
        - CODE_EXHAUSTED
        - WALLPAPER_UNAVAILABLE
        - FAILED

    RedemptionResult:
      type: object
      required: [idempotencyKey, result, quotaDelta, createdAt]
      properties:
        idempotencyKey:
          type: string
          format: uuid
        result:
          $ref: '#/components/schemas/RedemptionResultCode'
        quotaDelta:
          type: integer
          minimum: 0
          maximum: 1
        entitlement:
          type: object
          allOf:
            - $ref: '#/components/schemas/EntitlementSummary'
          nullable: true
          description: GRANTED 与 ALREADY_OWNED 时存在。
        errorCode:
          type: string
          maxLength: 64
          nullable: true
          description: 失败时的稳定业务错误码。
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    CreateDownloadTicketRequest:
      type: object
      required: [platform, supportedResourceTypes]
      properties:
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        osVersion:
          type: string
          maxLength: 32
          nullable: true
        supportedResourceTypes:
          type: array
          maxItems: 8
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceType'
        installedVersionNo:
          type: integer
          minimum: 1
          nullable: true

    DownloadDescriptor:
      type: object
      required: [deliveryMode, wallpaperId, cover]
      properties:
        deliveryMode:
          type: string
          enum: [H5_PLACEHOLDER, SECURE_PACKAGE]
        wallpaperId:
          $ref: '#/components/schemas/LongId'
        cover:
          $ref: '#/components/schemas/PublicMedia'
        ticket:
          type: string
          minLength: 32
          maxLength: 2048
          nullable: true
          readOnly: true
          description: SECURE_PACKAGE 时存在，H5_PLACEHOLDER 时为空。
        downloadUrl:
          type: string
          format: uri-reference
          nullable: true
          description: 不含票据的受控下载地址；客户端通过 Authorization Bearer 提交 ticket。
        expiresAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        resourceVersion:
          type: object
          allOf:
            - $ref: '#/components/schemas/DownloadResourceVersion'
          nullable: true
        package:
          type: object
          allOf:
            - $ref: '#/components/schemas/SecurePackageMetadata'
          nullable: true

    DownloadResourceVersion:
      type: object
      required: [id, variantId, versionNo, platform, resourceType, manifestSha256]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        variantId:
          $ref: '#/components/schemas/LongId'
        versionNo:
          type: integer
          minimum: 1
        platform:
          $ref: '#/components/schemas/DeliveryPlatform'
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        manifestSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'

    BindEncryptionKeyRequest:
      type: object
      additionalProperties: false
      required: [publicKeyPem]
      properties:
        publicKeyPem:
          type: string
          minLength: 400
          maxLength: 8192
          description: X.509 SubjectPublicKeyInfo PEM，RSA-2048，exponent=65537

    EncryptionKeyBinding:
      type: object
      required: [publicKeySha256, keyAlgorithm]
      properties:
        publicKeySha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        keyAlgorithm:
          type: string
          enum: [RSA-OAEP-SHA256-MGF1-SHA1]

    SecurePackageMetadata:
      type: object
      required:
        [
          formatVersion,
          sizeBytes,
          plaintextSizeBytes,
          encryptedSha256,
          plaintextSha256,
          signingKeyId,
          encryptionKeySha256,
          wrappedContentKey,
          keyAlgorithm
        ]
      properties:
        formatVersion:
          type: integer
          enum: [2]
        plaintextSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 68157404
        plaintextSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        signingKeyId:
          type: string
          pattern: '^[a-z0-9-]{1,64}$'
        encryptionKeySha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sizeBytes:
          type: integer
          format: int64
          minimum: 37
          maximum: 68157440
        encryptedSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        wrappedContentKey:
          type: string
          minLength: 342
          maxLength: 342
          pattern: '^[A-Za-z0-9_-]{342}$'
          readOnly: true
        keyAlgorithm:
          type: string
          enum: [RSA-OAEP-SHA256-MGF1-SHA1]

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true

    AdminSession:
      type: object
      required: [admin, csrfToken, expiresAt]
      properties:
        admin:
          type: object
          required: [id, username]
          properties:
            id:
              $ref: '#/components/schemas/LongId'
            username:
              type: string
              maxLength: 64
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          readOnly: true
        expiresAt:
          $ref: '#/components/schemas/Timestamp'

    AdminDashboard:
      type: object
      required:
        [
          publishedWallpaperCount,
          activeDeviceCount,
          entitlementCount,
          redemptionCountToday,
          generatedAt
        ]
      properties:
        publishedWallpaperCount:
          type: integer
          format: int64
          minimum: 0
        activeDeviceCount:
          type: integer
          format: int64
          minimum: 0
        entitlementCount:
          type: integer
          format: int64
          minimum: 0
        redemptionCountToday:
          type: integer
          format: int64
          minimum: 0
        generatedAt:
          $ref: '#/components/schemas/Timestamp'

    AssetValidationStatus:
      type: string
      enum: [UPLOADING, VALIDATING, READY, REJECTED]

    AdminAsset:
      type: object
      required:
        [
          id,
          originalFilename,
          mimeType,
          fileExtension,
          sizeBytes,
          sha256,
          validationStatus,
          createdAt,
          version
        ]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          maxLength: 100
        fileExtension:
          type: string
          maxLength: 16
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        widthPx:
          type: integer
          minimum: 1
          nullable: true
        heightPx:
          type: integer
          minimum: 1
          nullable: true
        durationMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        validationStatus:
          $ref: '#/components/schemas/AssetValidationStatus'
        validationErrorCode:
          type: string
          maxLength: 64
          nullable: true
        previewUrl:
          type: string
          format: uri-reference
          nullable: true
          description: 需要管理员会话的受控读取地址。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          format: int64
          minimum: 0

    AdminTutorialVideo:
      type: object
      required: [id, originalFilename, mimeType, sizeBytes, durationMs, validationStatus, previewUrl]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          enum: [video/mp4]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 209715200
        durationMs:
          type: integer
          format: int64
          minimum: 1
          maximum: 900000
        validationStatus:
          $ref: '#/components/schemas/AssetValidationStatus'
        previewUrl:
          type: string
          format: uri-reference

    AdminWallpaperTutorial:
      type: object
      required: [key, title, platform, wallpaperKind, enabled, sortOrder, video, updatedAt, version]
      properties:
        key:
          $ref: '#/components/schemas/WallpaperTutorialKey'
        title:
          type: string
          maxLength: 40
        platform:
          $ref: '#/components/schemas/DeliveryPlatform'
        wallpaperKind:
          $ref: '#/components/schemas/WallpaperKind'
        enabled:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
        video:
          type: object
          allOf:
            - $ref: '#/components/schemas/AdminTutorialVideo'
          nullable: true
        updatedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0

    WallpaperTutorialWriteRequest:
      type: object
      additionalProperties: false
      required: [videoAssetId, enabled, sortOrder]
      properties:
        videoAssetId:
          $ref: '#/components/schemas/LongId'
        enabled:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999

    PublicTutorialVideo:
      type: object
      required: [contentUrl, mimeType, sizeBytes, durationMs]
      properties:
        contentUrl:
          type: string
          format: uri-reference
        mimeType:
          type: string
          enum: [video/mp4]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 209715200
        durationMs:
          type: integer
          format: int64
          minimum: 1
          maximum: 900000

    PublicWallpaperTutorial:
      type: object
      required: [key, title, platform, wallpaperKind, sortOrder, video, updatedAt, version]
      properties:
        key:
          $ref: '#/components/schemas/WallpaperTutorialKey'
        title:
          type: string
          maxLength: 40
        platform:
          $ref: '#/components/schemas/DeliveryPlatform'
        wallpaperKind:
          $ref: '#/components/schemas/WallpaperKind'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
        video:
          $ref: '#/components/schemas/PublicTutorialVideo'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          format: int64
          minimum: 1

    AdminCategory:
      type: object
      required:
        [
          id,
          level,
          name,
          slug,
          sortOrder,
          wallpaperCount,
          children,
          createdAt,
          updatedAt,
          version
        ]
      properties:
        id:
          $ref: '#/components/schemas/LongId'
        parentId:
          type: string
          allOf:
            - $ref: '#/components/schemas/LongId'
          nullable: true
        level:
          type: integer
