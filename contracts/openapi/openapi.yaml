  /admin/app-releases/android:
    post:
      tags: [Admin App Releases]
      operationId: uploadAndroidAppRelease
      summary: 上传正式APK，解析实际版本并验签后生成草稿
      description: 实际包名必须匹配所选 App（倾境或吉意）；拒绝debuggable/testOnly/split、损坏或验签失败APK。每个应用独立递增版本并校验历史签名；默认forceUpdate=false，不自动启用。
      security: [{adminCookie: [], adminCsrf: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, releaseNotes]
              properties:
                file: {type: string, format: binary, description: 260MiB以内的完整正式APK}
                releaseNotes: {type: string, minLength: 1, maxLength: 1000}
                packageName: {type: string, enum: [com.qingjing.bizhi, com.jiyi.wallpaper], default: com.qingjing.bizhi, description: 所选目标应用；必须与APK实际解析包名一致}
      responses:
        '201': {$ref: '#/components/responses/AppReleaseResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413':
          description: APK超出上传大小限制
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalError'}

