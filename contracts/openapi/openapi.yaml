        - environmentId
        - wallpaperId
        - wallpaperVersion
        - attempt
        - completedSteps
        - result
        - errorCode
        - errorMessage
        - retryable
        - createdAt
        - updatedAt
        - clientProjectKey
        - action
        - title
      properties:
        taskId:
          $ref: "#/components/schemas/LongId"
        state:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - NEEDS_INPUT
        stage:
          type: string
        environmentId:
          type: string
        wallpaperId:
          type: string
          allOf:
            - $ref: "#/components/schemas/LongId"
          nullable: true
        wallpaperVersion:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        attempt:
          type: integer
          minimum: 0
        completedSteps:
          type: array
          items:
            $ref: "#/components/schemas/CreatorWallpaperPublicationStep"
        result:
          type: object
          allOf:
            - $ref: "#/components/schemas/CreatorWallpaperPublicationResult"
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        retryable:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        clientProjectKey:
          type: string
        action:
          type: string
          enum:
            - SAVE_DRAFT
            - PUBLISH
        title:
          type: string
    CreatorWallpaperPublicationPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreatorWallpaperPublicationTask"
        page:
          $ref: "#/components/schemas/PageMetadata"
    WallpaperPublicationCheck:
      type: object
      additionalProperties: false
      required:
        - scope
