        productId:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9._-]+$
          nullable: true
        chinaReferencePrice:
          type: string
          pattern: ^(?:0|[1-9][0-9]{0,7})\.[0-9]{2}$
