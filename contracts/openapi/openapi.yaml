          $ref: '#/components/schemas/PageMetadata'

    DeviceRegistrationRequest:
      type: object
      required: [platform, appInstallScope, credentialType, publicKeyPem, evidenceToken]
      properties:
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        appInstallScope:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            服务端精确匹配的安装包标识。HarmonyOS 固定为 com.qingjing.bizhi；
            iOS 允许 com.qingjing.bizhi 和 com.qingjing.livephotolab，不支持通配符。
        credentialType:
          type: string
          enum: [PLATFORM_PUBLIC_KEY]
        publicKeyPem:
          type: string
          minLength: 64
          maxLength: 8192
          description: |
            正式客户端必填的安装公钥。
            Android 和 HarmonyOS 使用 RSA-2048 X.509 SubjectPublicKeyInfo PEM。
            HarmonyOS 将 huks.exportKeyItem 返回的 X.509 SubjectPublicKeyInfo 原始字节用
            -----BEGIN PUBLIC KEY----- 和 -----END PUBLIC KEY----- 包装为 PEM。
            iOS 将 Secure Enclave 导出的 P-256 X9.63 未压缩公钥包装为 X.509
            SubjectPublicKeyInfo DER，再输出 PUBLIC KEY PEM。
        evidenceToken:
          type: string
          minLength: 16
          maxLength: 8192
          writeOnly: true
          description: |
            Base64URL 无填充编码的 UTF-8 JSON(timestamp, nonce, proof)。
            HarmonyOS proof 使用 HUKS RSA-2048 / SHA-256 / PKCS#1 v1.5 签署，再做 Base64URL 无填充编码。
            鸿蒙注册原文为 QJ-HARMONYOS-REGISTER-V1、appInstallScope、
            SHA-256(huks.exportKeyItem 原始字节)小写十六进制、timestamp 和 nonce，每项以换行分隔。
            iOS proof 使用 P-256 / ECDSA SHA-256 ASN.1 DER 签名，再做 Base64URL 无填充编码；
            注册域为 QJ-IOS-REGISTER-V1，公钥指纹是 SHA-256(SPKI DER) 小写十六进制。
            服务端只保留身份 keyed hash，不持久化完整证明。

    DeviceRegistrationResponse:
      type: object
      required: [credentialKeyId, credentialType, createdAt]
      properties:
        credentialKeyId:
          type: string
          format: uuid
        credentialType:
          type: string
          enum: [PLATFORM_PUBLIC_KEY]
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    DeviceSessionChallenge:
      type: object
      required: [challengeId, nonce, algorithm, expiresAt]
      properties:
        challengeId:
          type: string
          format: uuid
        nonce:
          type: string
          minLength: 32
          maxLength: 256
        algorithm:
          type: string
          enum: [ED25519, ECDSA_P256_SHA256, RSA_SHA256, HMAC_SHA256]
          description: Android 和 HarmonyOS 返回 RSA_SHA256；iOS 返回 ECDSA_P256_SHA256。
        expiresAt:
          $ref: '#/components/schemas/Timestamp'

    CreateDeviceSessionRequest:
      type: object
      required: [credentialKeyId, challengeId, clientTimestamp, proof]
      properties:
        credentialKeyId:
          type: string
          format: uuid
        challengeId:
          type: string
          format: uuid
        clientTimestamp:
          $ref: '#/components/schemas/Timestamp'
        proof:
          type: string
          minLength: 16
          maxLength: 2048
          writeOnly: true
          description: |
            对 QJ-DEVICE-SESSION-V1 规范原文生成的 Base64URL 无填充签名或 HMAC。
            HarmonyOS 使用 HUKS RSA-2048 / SHA-256 / PKCS#1 v1.5。
            iOS 使用 Secure Enclave P-256 / ECDSA SHA-256，签名字节为 ASN.1 DER。

