        - adminCookie: []
      responses:
        '200':
          description: 从业务事实实时或通过可丢失缓存计算的汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/assets:
    post:
      tags: [Admin Asset]
      operationId: uploadAdminAsset
      summary: 上传并校验一个资源文件
      description: |
        文件先写入隔离暂存区；校验通过后原子移入正式相对存储键。
        WALLPAPER_COVER 会在服务端统一缩小到不超过 720×1280，转换为 WebP 并移除原文件元数据；响应元数据为转换后文件。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 创作台上传建议发送 UUID；同一用途、文件及元数据重放返回原资产，不重新创建。
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose:
                  $ref: '#/components/schemas/AssetPurpose'
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 同一 Idempotency-Key 对应的原已上传资产
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAsset'}
        '409': {$ref: '#/components/responses/Conflict'}
        '201':
          description: 文件元数据；VALIDATING 表示异步校验尚未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 上传超过该用途允许的大小
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: 文件类型不受支持或探测类型与声明不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/parallax-packages:
    post:
      tags: [Admin Asset]
      operationId: importAdminParallaxPackage
      summary: 导入固定格式 4D ZIP 源包
      description: 同步校验根目录 config.json、连续编号的 2～12 层图片及配置稳定外壳，并原样保存格式版本不低于 2 的配置。兼容并忽略旧包中的根目录 cover.jpg，不再生成或返回包内封面资产。ZIP 最大 100 MiB、解压总量 85 MiB、64 条目、图层与配置 64 MiB。相同 SHA-256 的可用源包复用；不返回原始 ZIP 地址。
      security:
        - adminCookie: []
          adminCsrf: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 新源包及派生资产已校验并原子保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParallaxSourcePackage'
        '200':
          description: 复用相同 SHA-256 的可用源包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParallaxSourcePackage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: ZIP、单文件、条目解压总量或内部资源负载超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: ZIP 或图片真实类型不支持或与后缀不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/variants/{variantId}/parallax-resource-versions:
