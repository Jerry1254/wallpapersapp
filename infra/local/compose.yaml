name: qingjing-wallpaper-local

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${QJ_MYSQL_DATABASE}
      MYSQL_USER: ${QJ_MYSQL_USER}
      MYSQL_PASSWORD: ${QJ_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${QJ_MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${QJ_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - qingjing_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      QJ_REDIS_PASSWORD: ${QJ_REDIS_PASSWORD}
      TZ: UTC
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$QJ_REDIS_PASSWORD\""]
    ports:
      - "${QJ_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - qingjing_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$QJ_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ../../services/api-server
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      QJ_MYSQL_URL: jdbc:mysql://mysql:3306/${QJ_MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=UTC
      QJ_MYSQL_USER: ${QJ_MYSQL_USER}
      QJ_MYSQL_PASSWORD: ${QJ_MYSQL_PASSWORD}
      QJ_REDIS_HOST: redis
      QJ_REDIS_PORT: 6379
      QJ_REDIS_PASSWORD: ${QJ_REDIS_PASSWORD}
      QJ_STORAGE_ROOT: /app/.runtime/storage
      TZ: UTC
    ports:
      - "${QJ_API_HOST_PORT:-8080}:8080"
    volumes:
      - ../../.runtime/storage:/app/.runtime/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  qingjing_mysql_data:
  qingjing_redis_data:
