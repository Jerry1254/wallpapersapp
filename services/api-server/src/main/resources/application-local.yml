spring:
  datasource:
    url: ${QJ_MYSQL_URL:jdbc:mysql://127.0.0.1:3307/wallpaper_app?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=UTC}
    username: ${QJ_MYSQL_USER:wallpaper_app}
    password: ${QJ_MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${QJ_DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 10000
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
  data:
    redis:
      host: ${QJ_REDIS_HOST:127.0.0.1}
      port: ${QJ_REDIS_PORT:6380}
      password: ${QJ_REDIS_PASSWORD:}
      timeout: 3s

management:
  endpoint:
    health:
      show-details: always

qingjing:
  storage:
    root: ${QJ_STORAGE_ROOT:.runtime/storage}
