spring:
  application:
    name: qingjing-wallpaper-api
  profiles:
    default: local
  flyway:
    enabled: false
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 260MB
      max-request-size: 261MB

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    contract-version: ${QJ_API_CONTRACT_VERSION:2.4.1}
    environment-id: ${QJ_ENVIRONMENT_ID:UNCONFIGURED}
    deployment-stage: ${QJ_DEPLOYMENT_STAGE:UNCONFIGURED}
    git-commit: ${QJ_DEPLOYMENT_GIT_COMMIT:unknown}
    source-sha256: ${QJ_DEPLOYMENT_SOURCE_SHA256:unknown}
    artifact-sha256: ${QJ_DEPLOYMENT_ARTIFACT_SHA256:unknown}
    flyway-version: ${QJ_FLYWAY_VERSION:unknown}

qingjing:
  scheduling-enabled: ${QJ_SCHEDULING_ENABLED:true}
  delivery:
    ffprobe: ${QJ_FFPROBE:ffprobe}
    ffmpeg: ${QJ_FFMPEG:ffmpeg}
    signing-key-id: ${QJ_PACKAGE_SIGNING_KEY_ID:}
    signing-private-key: ${QJ_PACKAGE_SIGNING_PRIVATE_KEY:}
  api-base-path: /api/v1
  security:
    master-key: ${QJ_SECURITY_MASTER_KEY:}
  device:
    h5-test-enabled: false
    allowed-h5-scopes: []
    online-test-android-scopes:
      - com.qingjing.bizhi.internal
      - com.qingjing.bizhi.lab
    challenge-ttl: 2m
    session-ttl: 30m
    clock-skew: 5m
    nonce-ttl: 5m
  admin:
    session-ttl: 8h
    password-strength: 12
    cookie-secure: true
    bootstrap:
      username: ${QJ_ADMIN_USERNAME:}
      password: ${QJ_ADMIN_PASSWORD:}
