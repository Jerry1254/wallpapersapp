spring:
  application:
    name: qingjing-wallpaper-api
  profiles:
    default: local
  flyway:
    enabled: false
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 260MB
      max-request-size: 261MB

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    contract-version: 1.0.0

qingjing:
  api-base-path: /api/v1
  security:
    master-key: ${QJ_SECURITY_MASTER_KEY:}
  device:
    h5-test-enabled: false
    allowed-h5-scopes: []
    challenge-ttl: 2m
    session-ttl: 30m
    clock-skew: 5m
    nonce-ttl: 5m
  admin:
    session-ttl: 8h
    password-strength: 12
    cookie-secure: true
    bootstrap:
      username: ${QJ_ADMIN_USERNAME:}
      password: ${QJ_ADMIN_PASSWORD:}
