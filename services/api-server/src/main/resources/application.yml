spring:
  application:
    name: qingjing-wallpaper-api
  profiles:
    default: local
  flyway:
    enabled: false
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 260MB
      max-request-size: 261MB

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    contract-version: ${QJ_API_CONTRACT_VERSION:2.17.0}
    environment-id: ${QJ_ENVIRONMENT_ID:UNCONFIGURED}
    deployment-stage: ${QJ_DEPLOYMENT_STAGE:UNCONFIGURED}
    git-commit: ${QJ_DEPLOYMENT_GIT_COMMIT:unknown}
    source-sha256: ${QJ_DEPLOYMENT_SOURCE_SHA256:unknown}
    artifact-sha256: ${QJ_DEPLOYMENT_ARTIFACT_SHA256:unknown}
    flyway-version: ${QJ_FLYWAY_VERSION:unknown}

qingjing:
  scheduling-enabled: ${QJ_SCHEDULING_ENABLED:true}
  delivery:
    ffprobe: ${QJ_FFPROBE:ffprobe}
    ffmpeg: ${QJ_FFMPEG:ffmpeg}
    mp4box: ${QJ_MP4BOX:MP4Box}
    heif-encoder: ${QJ_HEIF_ENCODER:heif-enc}
    exiftool: ${QJ_EXIFTOOL:exiftool}
    signing-key-id: ${QJ_PACKAGE_SIGNING_KEY_ID:}
    signing-private-key: ${QJ_PACKAGE_SIGNING_PRIVATE_KEY:}
  api-base-path: /api/v1
  security:
    master-key: ${QJ_SECURITY_MASTER_KEY:}
  device:
    h5-test-enabled: false
    allowed-h5-scopes: []
    harmony-enabled: ${QJ_DEVICE_HARMONY_ENABLED:true}
    allowed-harmony-scopes:
      - com.qingjing.bizhi
    ios-enabled: ${QJ_DEVICE_IOS_ENABLED:true}
    allowed-ios-scopes:
      - ${QJ_DEVICE_IOS_PROD_SCOPE:com.qingjing.bizhi}
      - ${QJ_DEVICE_IOS_TEST_SCOPE:com.qingjing.livephotolab}
    online-test-android-scopes:
      - com.qingjing.bizhi.internal
      - com.qingjing.bizhi.lab
    challenge-ttl: 2m
    session-ttl: 30m
    clock-skew: 5m
    nonce-ttl: 5m
  admin:
    session-ttl: 8h
    password-strength: 12
    cookie-secure: true
    bootstrap:
      username: ${QJ_ADMIN_USERNAME:}
      password: ${QJ_ADMIN_PASSWORD:}
  ios-acquisition:
    enabled: ${QJ_IOS_ACQUISITION_ENABLED:false}
    team-id: ${QJ_APPLE_TEAM_ID:}
    app-id-prefix: ${QJ_APPLE_APP_ID_PREFIX:}
    bundle-id: ${QJ_APPLE_BUNDLE_ID:com.qingjing.bizhi}
    app-apple-id: ${QJ_APPLE_APP_ID:}
    app-attest-environment: ${QJ_APPLE_APP_ATTEST_ENVIRONMENT:DEVELOPMENT}
    store-environment: ${QJ_APPLE_STORE_ENVIRONMENT:SANDBOX}
    device-check-key-id: ${QJ_APPLE_DEVICECHECK_KEY_ID:}
    device-check-private-key: ${QJ_APPLE_DEVICECHECK_PRIVATE_KEY:}
    store-issuer-id: ${QJ_APPLE_STORE_ISSUER_ID:}
    store-key-id: ${QJ_APPLE_STORE_KEY_ID:}
    store-private-key: ${QJ_APPLE_STORE_PRIVATE_KEY:}
    device-check-private-key-file: ${QJ_APPLE_DEVICECHECK_PRIVATE_KEY_FILE:}
    store-private-key-file: ${QJ_APPLE_STORE_PRIVATE_KEY_FILE:}
    device-check-environment: ${QJ_APPLE_DEVICECHECK_ENVIRONMENT:DEVELOPMENT}
    accepted-store-environments: ${QJ_APPLE_ACCEPTED_STORE_ENVIRONMENTS:}
    accepted-bundle-versions: ${QJ_APPLE_ACCEPTED_BUNDLE_VERSIONS:}
    app-attest-root: ${QJ_APPLE_APP_ATTEST_ROOT:classpath:apple/Apple_App_Attestation_Root_CA.pem}
    store-root: ${QJ_APPLE_STORE_ROOT:classpath:apple/AppleRootCA-G3.cer}
    online-certificate-checks: ${QJ_APPLE_ONLINE_CERTIFICATE_CHECKS:true}
    connect-timeout: ${QJ_APPLE_CONNECT_TIMEOUT:5s}
    request-timeout: ${QJ_APPLE_REQUEST_TIMEOUT:15s}
    challenge-ttl: 2m
    reset-ttl: 30m
  ios-pricing:
    enabled: ${QJ_IOS_PRICE_SYNC_ENABLED:false}
    issuer-id: ${QJ_ASC_PRICE_ISSUER_ID:}
    key-id: ${QJ_ASC_PRICE_KEY_ID:}
    private-key: ${QJ_ASC_PRICE_PRIVATE_KEY:}
    private-key-file: ${QJ_ASC_PRICE_PRIVATE_KEY_FILE:}
    max-age: 15m
    sync-delay: 300000
    initial-delay: 15000
